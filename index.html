<style>
:root{--red:#ff2e4d;--grn:#19e07a;--ylw:#ffd400;--bg:#0b0b0f;--card:#16161d}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:#fff;font-family:Impact,"Anton","Arial Black",system-ui,sans-serif;display:flex;justify-content:center;overflow-x:hidden}
.app{width:100%;max-width:560px;min-height:100%;display:flex;flex-direction:column;padding:12px 14px calc(14px + env(safe-area-inset-bottom));gap:12px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:18px;letter-spacing:.5px}
.logo{font-size:22px}.logo b{color:var(--red)}.logo i{font-style:normal;color:var(--grn)}
.pill{background:#22222c;border-radius:999px;padding:6px 12px;font-family:system-ui,sans-serif;font-weight:800;font-size:14px}
.bar{height:6px;background:#22222c;border-radius:9px;overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,var(--red),var(--ylw),var(--grn));width:0;transition:width .3s}
.shot{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:16/10;border:3px solid #2a2a35;box-shadow:0 10px 40px #0008}
.shot img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.shot .chrome{position:absolute;top:0;left:0;right:0;height:18px;background:#d9d9de;display:flex;gap:5px;align-items:center;padding-left:8px}
.shot .chrome span{width:7px;height:7px;border-radius:50%;background:#ff5f57}.shot .chrome span:nth-child(2){background:#febc2e}.shot .chrome span:nth-child(3){background:#28c840}
.shot img{padding-top:18px;background:#fff}
.stamp{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-14deg) scale(3);opacity:0;border:6px solid currentColor;padding:4px 16px;font-size:clamp(34px,10vw,64px);letter-spacing:2px;border-radius:8px;background:#0007;text-shadow:0 2px 0 #000;white-space:nowrap;pointer-events:none}
.stamp.on{animation:slam .35s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes slam{to{transform:translate(-50%,-50%) rotate(-14deg) scale(1);opacity:1}}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font-family:inherit;border:0;cursor:pointer;color:#fff;border-radius:16px;font-size:clamp(26px,8vw,40px);padding:18px 6px;letter-spacing:1px;box-shadow:0 6px 0 #0009;transition:transform .08s}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #0009}
.scam{background:var(--red)}.startup{background:var(--grn);color:#062}
button small{display:block;font-family:system-ui;font-size:11px;opacity:.7;letter-spacing:0;margin-top:2px}
button[disabled]{filter:grayscale(.8) brightness(.6)}
button.picked{outline:4px solid #fff}
.rev{display:none;text-align:center;gap:6px;flex-direction:column;align-items:center}
.rev.on{display:flex}
.verdict{font-size:clamp(40px,13vw,72px);line-height:1}
.verdict.ok{color:var(--grn)}.verdict.no{color:var(--red)}
.ans{font-size:22px;letter-spacing:1px}
.fact{font-family:system-ui,sans-serif;font-weight:700;font-size:16px;color:#ddd;max-width:440px}
.src{font-family:system-ui;font-size:11px;color:#777}.src a{color:#999}
.next{background:#fff;color:#000;width:100%;margin-top:6px;font-size:28px;padding:14px}
.toast{font-size:20px;color:var(--ylw);min-height:24px;text-align:center}
.screen{display:none;flex-direction:column;gap:14px;align-items:center;text-align:center;justify-content:center;flex:1}
.screen.on{display:flex}
.big{font-size:clamp(54px,17vw,96px);line-height:.9}.big b{color:var(--red)}.big i{font-style:normal;color:var(--grn)}
.sub{font-family:system-ui;font-weight:700;color:#aaa;font-size:15px}
.go{background:var(--ylw);color:#000;font-size:34px;padding:16px 40px}
.score{font-size:96px;line-height:1}.rank{font-size:34px;color:var(--ylw)}
.grid{font-size:26px;letter-spacing:2px}
.row{display:flex;gap:10px;width:100%}.row button{flex:1;font-size:24px;padding:14px}
.share{background:var(--red)}.again{background:#2a2a35}
.shake{animation:sh .35s}@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#game{display:none;flex-direction:column;gap:12px}#game.on{display:flex}
.foot{font-family:system-ui;font-size:10px;color:#555;text-align:center;margin-top:auto}
@media(min-width:700px){.app{padding-top:28px}}

@media(max-width:699px){.shot{aspect-ratio:4/5}.shot img{object-position:top center}}
.shot img{cursor:zoom-in}
.zoom{position:fixed;inset:0;background:#000e;z-index:99;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
.zoom.on{display:block}
.zoom img{display:block;width:1280px;max-width:none;height:auto}
.zoom .x{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;background:#fff;color:#000;border:0;border-radius:50%;width:40px;height:40px;font:900 20px system-ui;z-index:100}
.hint{position:absolute;bottom:8px;right:8px;background:#000a;color:#fff;font:700 12px system-ui;padding:4px 8px;border-radius:10px;pointer-events:none}

@media(min-width:1000px){
.app{max-width:1500px;padding-left:32px;padding-right:32px}
#game.on{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto auto 1fr;column-gap:24px;row-gap:14px;align-items:start}
#game .shot{grid-column:1;grid-row:1/4;width:100%;max-height:calc(100vh - 140px);aspect-ratio:16/10;margin:0 auto}
#game .btns{grid-column:2;grid-row:1;grid-template-columns:1fr;gap:14px}
#game .btns button{padding:28px 10px}
#game .toast{grid-column:2;grid-row:2}
#game .rev{grid-column:2;grid-row:3}
#game .next{width:100%}
}
@media(min-width:700px){
.app{gap:16px}
.shot{border-radius:18px}
#btns button,.go{font-size:clamp(28px,3vw,44px)}
#rev .verdict,#verdict{font-size:clamp(48px,6vw,84px)}
.fact{font-size:clamp(16px,1.4vw,22px);max-width:760px}
}

const R=[{"id":"bodega","answer":"startup","stamp":"RENAMED","fact":"Ex-Googlers' vending box. Renamed after backlash. Dead 2020.","sources":["https://en.wikipedia.org/wiki/Stockwell_(company)"],"archive":"https://web.archive.org/web/20170916014934/http://www.bodega.ai/","img":"img/bodega.jpg"},{"id":"justyo","answer":"startup","stamp":"FUNDED","fact":"An app that only says “Yo”. Raised $1M+.","sources":["https://en.wikipedia.org/wiki/Yo_(app)"],"archive":"https://web.archive.org/web/20140801190507/http://justyo.co/","img":"img/justyo.jpg"},{"id":"clinkle","answer":"startup","stamp":"DEAD","fact":"Largest seed round in Silicon Valley history ($25M). Shut down 2016.","sources":["https://en.wikipedia.org/wiki/Clinkle"],"archive":"https://web.archive.org/web/20131203005516/http://clinkle.com/","img":"img/clinkle.jpg"},{"id":"homejoy","answer":"startup","stamp":"DEAD","fact":"Shut down in 2015 amid worker-classification lawsuits.","sources":["https://en.wikipedia.org/wiki/Homejoy"],"archive":"https://web.archive.org/web/20140602062639/http://www.homejoy.com/","img":"img/homejoy.jpg"},{"id":"shyp","answer":"startup","stamp":"DEAD","fact":"Raised $62.1M to ship your stuff. Shut down 2018.","sources":["https://en.wikipedia.org/wiki/Shyp"],"archive":"https://web.archive.org/web/20150531175715/http://www.shyp.com/","img":"img/shyp.jpg"},{"id":"forsage","answer":"scam","stamp":"PYRAMID","fact":"SEC: $300M+ crypto pyramid & Ponzi.","sources":["https://www.sec.gov/newsroom/press-releases/2022-134"],"archive":"https://web.archive.org/web/20210517225452/https://forsage.io/","img":"img/forsage.jpg"},{"id":"plexcoin","answer":"scam","stamp":"FROZEN","fact":"Promised 1,354% in 29 days. SEC froze it.","sources":["https://www.sec.gov/newsroom/press-releases/2017-219"],"archive":"https://web.archive.org/web/20171003050518/http://www.plexcoin.com/","img":"img/plexcoin.jpg"},{"id":"hyperverse","answer":"scam","stamp":"PYRAMID","fact":"SEC: $1.7B HyperFund pyramid. UK FCA warned against it.","sources":["https://en.wikipedia.org/wiki/HyperVerse","https://www.sec.gov/newsroom/press-releases/2024-11","https://www.fca.org.uk/news/warnings/hyperfund-hyperverse-hypernation-hypercommunity"],"archive":"https://web.archive.org/web/20220205115558/https://thehyperverse.net/","img":"img/hyperverse.jpg"},{"id":"tbis","answer":"scam","stamp":"FAKE","fact":"Claimed ties to PayPal, Disney & the Fed. SEC halted it.","sources":["https://www.sec.gov/newsroom/press-releases/2018-94"],"archive":"https://web.archive.org/web/20171210111550/http://www.tbis.io/","img":"img/tbis.jpg"},{"id":"zeekrewards","answer":"scam","stamp":"PONZI","fact":"SEC: $600M Ponzi. ~98% of revenue came from new investors.","sources":["https://www.sec.gov/newsroom/press-releases/2012-2012-160htm"],"archive":"https://web.archive.org/web/20120301074133/http://zeekrewards.com/","img":"img/zeekrewards.jpg"},{"id":"vemma","answer":"scam","stamp":"PYRAMID","fact":"Energy drinks. The FTC shut it down as a pyramid scheme in 2015.","sources":["https://en.wikipedia.org/wiki/Vemma"],"archive":"https://web.archive.org/web/20150603075612/http://www.vemma.com/","img":"img/vemma.jpg"},{"id":"bancdebinary","answer":"scam","stamp":"BANNED","fact":"Binary options. Paid $11M to settle US charges. Banned in several countries.","sources":["https://en.wikipedia.org/wiki/Banc_De_Binary"],"archive":"https://web.archive.org/web/20130604010346/http://www.bancdebinary.com/","img":"img/bancdebinary.jpg"},{"id":"woodbridge","answer":"scam","stamp":"PONZI","fact":"SEC: $1.2B Ponzi scheme. Over 8,400 investors, many of them seniors.","sources":["https://www.sec.gov/newsroom/press-releases/2017-235"],"archive":"https://web.archive.org/web/20170530195324/http://woodbridgecompanies.com/","img":"img/woodbridge.jpg"},{"id":"arisebank","answer":"scam","stamp":"HALTED","fact":"\"Decentralized bank\" ICO. SEC halted it; it falsely claimed to own an FDIC-insured bank.","sources":["https://www.sec.gov/newsroom/press-releases/2018-8"],"archive":"https://web.archive.org/web/20180104183834/http://www.arisebank.com/","img":"img/arisebank.jpg"},{"id":"bitqyck","answer":"scam","stamp":"FRAUD","fact":"SEC: touted a crypto mining facility it didn't own. 13,000 investors.","sources":["https://www.sec.gov/newsroom/press-releases/2019-164"],"archive":"https://web.archive.org/web/20170603210125/http://bitqyck.com/","img":"img/bitqyck.jpg"},{"id":"empiresx","answer":"scam","stamp":"FAKE BOT","fact":"SEC: \"trading bot\" promising 1% daily. Leased a Lamborghini.","sources":["https://www.sec.gov/newsroom/press-releases/2022-119"],"archive":"https://web.archive.org/web/20210603222056/https://empiresx.com/","img":"img/empiresx.jpg"},{"id":"mmm","answer":"scam","stamp":"PONZI","fact":"One of the largest Ponzi schemes in the world. Relaunched as MMM Global in 2011.","sources":["https://en.wikipedia.org/wiki/MMM_(Ponzi_scheme_company)"],"archive":"https://web.archive.org/web/20150515200943/http://mmmglobal.org/","img":"img/mmm.jpg"},{"id":"mti","answer":"scam","stamp":"PONZI","fact":"Bitcoin \"trading bot\". Collapsed in 2020 when the CEO vanished.","sources":["https://en.wikipedia.org/wiki/Mirror_Trading_International"],"archive":"https://web.archive.org/web/20200804030826/https://mirrortradinginternational.com/","img":"img/mti.jpg"},{"id":"ezubao","answer":"scam","stamp":"PONZI","fact":"Chinese P2P lending site. Took ~$7.6B from 900,000 investors; its own president called it a Ponzi.","sources":["https://en.wikipedia.org/wiki/Ezubao"],"archive":"https://web.archive.org/web/20150913162200/http://www.ezubao.com/","img":"img/ezubao.jpg"},{"id":"blockvest","answer":"scam","stamp":"HALTED","fact":"SEC: ICO falsely claimed SEC approval and invented a fake \"Blockchain Exchange Commission\".","sources":["https://www.sec.gov/newsroom/press-releases/2018-232"],"archive":"https://web.archive.org/web/20180923163138/http://www.blockvest.com/","img":"img/blockvest.jpg"},{"id":"agridime","answer":"scam","stamp":"PONZI","fact":"Cattle investments paying 15-32% a year. SEC: a $191M Ponzi scheme.","sources":["https://www.sec.gov/newsroom/press-releases/2023-250"],"archive":"https://web.archive.org/web/20230620210935/https://www.agridime.com/","img":"img/agridime.jpg"},{"id":"gpb","answer":"scam","stamp":"PONZI-LIKE","fact":"Private equity paying 8% a year. SEC: $1.7B \"Ponzi-like scheme\", 17,000+ investors.","sources":["https://www.sec.gov/newsroom/press-releases/2021-24"],"archive":"https://web.archive.org/web/20190113123520/http://www.gpb-cap.com/","img":"img/gpb.jpg"},{"id":"dcsolar","answer":"scam","stamp":"PONZI","fact":"Mobile solar generators. Up to three-quarters of them never existed. ~$1B Ponzi.","sources":["https://en.wikipedia.org/wiki/DC_Solar"],"archive":"https://web.archive.org/web/20180804162443/http://dcsolar.com/","img":"img/dcsolar.jpg"},{"id":"withfrank","answer":"both","stamp":"CONVICTED","fact":"Sold to JPMorgan for $175M. Founder convicted of fraud.","sources":["https://en.wikipedia.org/wiki/Charlie_Javice"],"archive":"https://web.archive.org/web/20201101134313/https://withfrank.org/","img":"img/withfrank.jpg"},{"id":"headspin","answer":"both","stamp":"CHARGED","fact":"Valued at ~$1.1B. Reported $95.3M revenue; DOJ says real was $26.3M.","sources":["https://www.justice.gov/usao-ndca/pr/co-founder-and-former-ceo-palo-alto-based-start-technology-company-headspin-charged"],"archive":"https://web.archive.org/web/20200530104609/https://www.headspin.io/","img":"img/headspin.jpg"},{"id":"ubiome","answer":"both","stamp":"RAIDED","fact":"Microbiome testing startup. FBI raid, bankruptcy, founders charged.","sources":["https://en.wikipedia.org/wiki/UBiome"],"archive":"https://web.archive.org/web/20180601103805/https://ubiome.com/","img":"img/ubiome.jpg"},{"id":"joonko","answer":"both","stamp":"CHARGED","fact":"AI diversity hiring. SEC: founder used fake customers and forged bank statements.","sources":["https://www.sec.gov/newsroom/press-releases/2024-70"],"archive":"https://web.archive.org/web/20210507194005/https://joonko.co/","img":"img/joonko.jpg"},{"id":"nate","answer":"both","stamp":"CHARGED","fact":"\"AI\" shopping app. DOJ: automation was ~0%; humans in the Philippines did it.","sources":["https://www.justice.gov/usao-sdny/pr/tech-ceo-charged-artificial-intelligence-investment-fraud-scheme"],"archive":"https://web.archive.org/web/20210610222441/https://www.nate.tech/","img":"img/nate.jpg"},{"id":"ozy","answer":"both","stamp":"CONVICTED","fact":"Media startup. Company and co-founder convicted of fraud in 2024.","sources":["https://en.wikipedia.org/wiki/Ozy_Media"],"archive":"https://web.archive.org/web/20200602054711/https://www.ozy.com/","img":"img/ozy.jpg"},{"id":"quadrigacx","answer":"both","stamp":"PONZI","fact":"Canadian crypto exchange. Regulator later called it a fraud and Ponzi.","sources":["https://en.wikipedia.org/wiki/Quadriga_(cryptocurrency_exchange)"],"archive":"https://web.archive.org/web/20180604145317/http://quadrigacx.com/","img":"img/quadrigacx.jpg"},{"id":"fast","answer":"startup","stamp":"DEAD","fact":"Raised $124M. Six-figure revenue. Burned ~$10M a month. Dead 2022.","sources":["https://techcrunch.com/2022/04/05/fast-shuts-doors-after-slow-growth-high-burn-precluded-fundraising-options/"],"archive":"https://web.archive.org/web/20210303083011/http://fast.co/","img":"img/fast.jpg"},{"id":"thodex","answer":"scam","stamp":"EXIT SCAM","fact":"Turkish exchange. Owner fled with about $2B. Sentenced to 11,196 years.","sources":["https://en.wikipedia.org/wiki/Thodex"],"archive":"https://web.archive.org/web/20210320131125/https://www.thodex.com/tr","img":"img/thodex.jpg"},{"id":"wcm777","answer":"scam","stamp":"PONZI","fact":"Promised 100% in 100 days. SEC: Ponzi. Money went to golf courses.","sources":["https://www.sec.gov/newsroom/press-releases/2014-60"],"archive":"https://web.archive.org/web/20131201075427/http://www.wcm777.hk/","img":"img/wcm777.jpg"},{"id":"gawminers","answer":"scam","stamp":"PONZI","fact":"SEC: sold shares of mining power that never existed.","sources":["https://www.sec.gov/newsroom/press-releases/2015-271"],"archive":"https://web.archive.org/web/20141207195530/https://gawminers.com/","img":"img/gawminers.jpg"},{"id":"driveplanning","answer":"scam","stamp":"PONZI","fact":"Promised 10% every 3 months on real estate. SEC: $300M Ponzi, a $3.1M yacht.","sources":["https://www.sec.gov/newsroom/press-releases/2024-97"],"archive":"https://web.archive.org/web/20220531221218/https://driveplanning.com/","img":"img/driveplanning.jpg"},{"id":"hashflare","answer":"scam","stamp":"PONZI","fact":"Cloud crypto mining. DOJ: $577M in sales, dashboards showed fake mining data.","sources":["https://www.justice.gov/opa/pr/two-estonian-nationals-plead-guilty-577m-cryptocurrency-fraud-scheme"],"archive":"https://web.archive.org/web/20180601221525/https://www.hashflare.io/","img":"img/hashflare.jpg"},{"id":"novatech","answer":"scam","stamp":"FRAUD","fact":"SEC: $650M fraud on 200,000+ investors.","sources":["https://www.sec.gov/newsroom/press-releases/2024-95"],"archive":"https://web.archive.org/web/20220526021208/http://novatechfx.com/","img":"img/novatech.jpg"},{"id":"eminifx","answer":"scam","stamp":"FRAUD","fact":"\"AI Robo-Advisor\" promised 5% a week. CEO got 9 years.","sources":["https://www.justice.gov/usao-sdny/pr/ceo-cryptocurrency-and-forex-trading-platform-sentenced-nine-years-prison-240-million"],"archive":"https://web.archive.org/web/20220516122343/http://eminifx.com/","img":"img/eminifx.jpg"},{"id":"usitech","answer":"scam","stamp":"PONZI","fact":"Bitcoin \"trading bot\". Texas regulators: Ponzi hallmarks.","sources":["https://en.wikipedia.org/wiki/USI_Tech"],"archive":"https://web.archive.org/web/20171231223804/http://usitech-int.com/","img":"img/usitech.jpg"},{"id":"meta1","answer":"scam","stamp":"FRAUD","fact":"SEC: claimed backing by a $1B art collection. Promised up to 224,923% returns.","sources":["https://www.sec.gov/newsroom/press-releases/2020-66"],"archive": ry-swap stations for electric cars. Spent about $850M. Bankrupt in 2013.","sources":["https://en.wikipedia.org/wiki/Better_Place_(company)"],"archive":"https://web.archive.org/web/20120604045936/http://www.betterplace.com/","img":"img/betterplace.jpg"},{"id":"brandless","answer":"startup","stamp":"FUNDED","fact":"Everything for $3. Raised $240M in a 2019 round. The CEO stepped down after friction with SoftBank.","sources":["https://en.wikipedia.org/wiki/Brandless"],"archive":"https://web.archive.org/web/20190301210550/https://brandless.com/","img":"img/brandless.jpg"},{"id":"bump","answer":"startup","stamp":"ACQUIRED","fact":"Bump-your-phones sharing app. Google bought it in 2013 and killed it in 2014.","sources":["https://en.wikipedia.org/wiki/Bump_(application)"],"archive":"https://web.archive.org/web/20130302055026/http://bu.mp/","img":"img/bump.jpg"},{"id":"diaspora","answer":"startup","stamp":"CROWDFUNDED","fact":"NYU students' anti-Facebook social network. Raised $200K+ on Kickstarter.","sources":["https://en.wikipedia.org/wiki/Diaspora_(social_network)"],"archive":"https://web.archive.org/web/20120528071957/https://www.joindiaspora.com/","img":"img/diaspora.jpg"},{"id":"dodgeball","answer":"startup","stamp":"ACQUIRED","fact":"Mobile check-in service. Google bought it in 2005 and shut it in 2009. A founder then built Foursquare.","sources":["https://en.wikipedia.org/wiki/Dodgeball_(service)"],"archive":"https://web.archive.org/web/20050602003940/http://dodgeball.com/","img":"img/dodgeball.jpg"},{"id":"doppler","answer":"startup","stamp":"DEAD","fact":"Earbuds billed as the \"world's first in-ear computer\". Raised $50M+. Shut down when it couldn't raise a Series C.","sources":["https://en.wikipedia.org/wiki/Doppler_Labs"],"archive":"https://web.archive.org/web/20170602034215/https://www.dopplerlabs.com/","img":"img/doppler.jpg"},{"id":"ello","answer":"startup","stamp":"INVITE-ONLY","fact":"Ad-free social network with an anti-Facebook manifesto. Launched invite-only in 2014.","sources":["https://en.wikipedia.org/wiki/Ello_(social_network)"],"archive":"https://web.archive.org/web/20150602194622/http://ello.co/","img":"img/ello.jpg"},{"id":"etherpad","answer":"startup","stamp":"ACQUIRED","fact":"Real-time collaborative text editor. Google acquired it in Dec 2009.","sources":["https://en.wikipedia.org/wiki/Etherpad"],"archive":"https://web.archive.org/web/20090604095353/http://etherpad.com/","img":"img/etherpad.jpg"},{"id":"gowalla","answer":"startup","stamp":"ACQUIRED","fact":"Location check-in app. Facebook acquired it in Dec 2011.","sources":["https://en.wikipedia.org/wiki/Gowalla"],"archive":"https://web.archive.org/web/20110602053725/http://gowalla.com/","img":"img/gowalla.jpg"},{"id":"hailo","answer":"startup","stamp":"MERGED","fact":"Taxi-hailing app in 16 cities. Absorbed into Daimler-owned myTaxi in 2016.","sources":["https://en.wikipedia.org/wiki/Hailo"],"archive":"https://web.archive.org/web/20130607022406/http://hailoapp.com/","img":"img/hailo.jpg"},{"id":"jaiku","answer":"startup","stamp":"ACQUIRED","fact":"Finnish microblogging with a Nokia app. Google bought it in 2007.","sources":["https://en.wikipedia.org/wiki/Jaiku"],"archive":"https://web.archive.org/web/20070531174807/http://www.jaiku.com/","img":"img/jaiku.jpg"},{"id":"jelly","answer":"startup","stamp":"ACQUIRED","fact":"Ask a question with a photo; strangers answer. Pinterest acquired it in 2017.","sources":["https://en.wikipedia.org/wiki/Jelly_(app)"],"archive":"https://web.archive.org/web/20140602031731/http://jelly.co/","img":"img/jelly.jpg"},{"id":"katerra","answer":"startup","stamp":"BANKRUPT","fact":"Construction startup. SoftBank's Vision Fund put in more than $2B. Bankrupt in 2021.","sources":["https://en.wikipedia.org/wiki/Katerra"],"archive":"https://web.archive.org/web/20200527053358/https://www.katerra.com/","img":"img/katerra.jpg"},{"id":"loopt","answer":"startup","stamp":"ACQUIRED","fact":"See where your friends are. Raised $30M+. Sold for up","stamp":"DEAD","fact":"Ridesharing pioneer. Fined $20,000 by California regulators in 2012. Shut down Dec 2015.","sources":["https://en.wikipedia.org/wiki/Sidecar_(company)"],"archive":"https://web.archive.org/web/20150302160302/http://www.side.cr/","img":"img/sidecar.jpg"},{"id":"socialcam","answer":"startup","stamp":"ACQUIRED","fact":"Video sharing app. 16M downloads. Autodesk paid $60M in 2012.","sources":["https://en.wikipedia.org/wiki/Socialcam"],"archive":"https://web.archive.org/web/20120525092223/http://socialcam.com/","img":"img/socialcam.jpg"},{"id":"turntable","answer":"startup","stamp":"DEAD","fact":"Raised $7M at a $35M valuation in 2011. Shut down in Dec 2013.","sources":["https://en.wikipedia.org/wiki/Turntable.fm"],"archive":"https://web.archive.org/web/20130317104337/http://turntable.fm/","img":"img/turntable.jpg"},{"id":"zirtual","answer":"startup","stamp":"PAUSED","fact":"Virtual assistants for busy founders. Raised a $2M seed. Paused all operations overnight in Aug 2015.","sources":["https://en.wikipedia.org/wiki/Zirtual"],"archive":"https://web.archive.org/web/20140605173932/https://www.zirtual.com/","img":"img/zirtual.jpg"},{"id":"xobni","answer":"startup","stamp":"ACQUIRED","fact":"\"Inbox\" spelled backwards. An Outlook plugin. Yahoo acquired it in 2013.","sources":["https://en.wikipedia.org/wiki/Xobni"],"archive":"https://web.archive.org/web/20110603234415/http://www.xobni.com/","img":"img/xobni.jpg"},{"id":"posterous","answer":"startup","stamp":"ACQUIRED","fact":"Blog by email. Twitter took much of the team in 2012; site shut 2013.","sources":["https://en.wikipedia.org/wiki/Posterous"],"archive":"https://web.archive.org/web/20110601202358/http://posterous.com/","img":"img/posterous.jpg"},{"id":"sparrow","answer":"startup","stamp":"ACQUIRED","fact":"A Mac email app. Google bought it in 2012 and stopped development.","sources":["https://en.wikipedia.org/wiki/Sparrow_(email_client)"],"archive":"https://web.archive.org/web/20120304212936/http://www.sparrowmailapp.com/","img":"img/sparrow.jpg"},{"id":"lytro","answer":"startup","stamp":"DEAD","fact":"Light-field camera: refocus after you shoot. Shut down in March 2018.","sources":["https://en.wikipedia.org/wiki/Lytro"],"archive":"https://web.archive.org/web/20120601073034/http://www.lytro.com/","img":"img/lytro.jpg"},{"id":"dropcam","answer":"startup","stamp":"$555M EXIT","fact":"Wi-Fi home cameras. Google's Nest paid $555M in 2014.","sources":["https://en.wikipedia.org/wiki/Dropcam"],"archive":"https://web.archive.org/web/20130530182852/https://www.dropcam.com/","img":"img/dropcam.jpg"},{"id":"quirky","answer":"startup","stamp":"BANKRUPT","fact":"Crowdsourced inventions. Raised $79M from GE and VCs in 2013. Bankrupt in 2015.","sources":["https://en.wikipedia.org/wiki/Quirky_(company)"],"archive":"https://web.archive.org/web/20140603064911/http://www.quirky.com/","img":"img/quirky.jpg"},{"id":"aereo","answer":"startup","stamp":"BANKRUPT","fact":"Live TV over the internet via tiny antennas. Lost at the Supreme Court in 2014; bankrupt months later.","sources":["https://en.wikipedia.org/wiki/Aereo"],"archive":"https://web.archive.org/web/20140602031732/https://aereo.com/","img":"img/aereo.jpg"},{"id":"munchery","answer":"startup","stamp":"DEAD","fact":"Chef-made dinners delivered. Raised an $85M Series C in 2015. Shut down abruptly in Jan 2019.","sources":["https://en.wikipedia.org/wiki/Munchery"],"archive":"https://web.archive.org/web/20150530212036/https://www.munchery.com/","img":"img/munchery.jpg"},{"id":"rethink","answer":"startup","stamp":"DEAD","fact":"Collaborative factory robots, starting with Baxter in 2012. Ceased operations in Oct 2018.","sources":["https://en.wikipedia.org/wiki/Rethink_Robotics"],"archive":"https://web.archive.org/web/20130603210814/http://www.rethinkrobotics.com/","img":"img/rethink.jpg"},{"id":"zume","answer":"startup","stamp":"DEAD","fact":"Pizza made by robots and baked en route to you. Pivoted to packaging, shut down in 2023.","sources":["https://en.wikipedia.org/wiki/Zume"],"archive":"https://web.archive.org/web/20190528152144/https://zumepizza.com/","img":"img/zume.jpg"},{"id":"akazoo","answer":"both","stamp":"SETTLED","fact":"Music streaming app. SEC: defrauded investors; settled for $38.8M.","sources":["https://en.wikipedia.org/wiki/InternetQ"],"archive":"https://web.archive.org/web/20190519064216/https://www.akazoo.com/","img":"img/akazoo.jpg"},{"id":"bitwise","answer":"both","stamp":"GUILTY","fact":"Tech training and coworking startup. Founders pleaded guilty to wire fraud; $115M restitution, 9 and 11 years.","sources":["https://en.wikipedia.org/wiki/Bitwise_Industries"],"archive":"https://web.archive.org/web/20210524205401/https://bitwiseindustries.com/","img":"img/bitwise.jpg"},{"id":"lily","answer":"both","stamp":"SUED","fact":"Self-flying camera drone. $34M in pre-orders. Never shipped; SF DA sued over faked demo videos.","sources":["https://en.wikipedia.org/wiki/Lily_Robotics"],"archive":"https://web.archive.org/web/20160528174222/https://www.lily.camera/","img":"img/lily.jpg"},{"id":"zenefits","answer":"both","stamp":"FINED","fact":"HR software startup, valued at $4.5B. Then California's insurance regulator fined it $7M.","sources":["https://en.wikipedia.org/wiki/TriNet_Zenefits"],"archive":"https://web.archive.org/web/20160301030200/https://www.zenefits.com/","img":"img/zenefits.jpg"},{"id":"mutualbenefits","answer":"scam","stamp":"PONZI","fact":"Buy strangers' life insurance policies. A Ponzi; investors lost about $835M.","sources":["https://en.wikipedia.org/wiki/Mutual_Benefits_Corporation"],"archive":"https://web.archive.org/web/20040206201716/http://mutualbenefitscorp.com/","img":"img/mutualbenefits.jpg"},{"id":"aequitas","answer":"both","stamp":"PONZI-LIKE","fact":"Healthcare and education receivables. SEC: hid its collapse while raising $350M; new money paid old investors.","sources":["https://www.sec.gov/newsroom/press-releases/2016-49"],"archive":"https://web.archive.org/web/20140610070757/http://www.aequitascapital.com/","img":"img/aequitas.jpg"},{"id":"parfunding","answer":"both","stamp":"INDICTED","fact":"Small-business loans, some at 400%+ interest. SEC: ~$500M from 1,200 investors. Principals indicted.","sources":["https://www.sec.gov/enforcement-litigation/litigation-releases/lr-24860","https://www.fdicoig.gov/news/investigations-press-releases/par-funding-principals-charged-securities-fraud-extortion-tax"],"archive":"https://web.archive.org/web/20200516135151/https://parfunding.com/","img":"img/parfunding.jpg"},{"id":"arbitrade","answer":"scam","stamp":"SHAM GOLD","fact":"Claimed $10B of gold bullion backed its token. SEC: the gold deal was a sham; $36.8M of tokens sold.","sources":["https://www.sec.gov/enforcement-litigation/litigation-releases/lr-25537"],"archive":"https://web.archive.org/web/20181224082749/http://arbitrade.io/","img":"img/arbitrade.jpg"},{"id":"shopin","answer":"scam","stamp":"FRAUD","fact":"Blockchain shopper profiles. SEC: raised $42M, never built a working platform; money went to rent and a dating service.","sources":["https://www.sec.gov/newsroom/press-releases/2019-259"],"archive":"https://web.archive.org/web/20180225153739/http://shopin.com/","img":"img/shopin.jpg"},{"id":"airbitclub","answer":"scam","stamp":"PYRAMID","fact":"Crypto mining & trading \"club\" with guaranteed daily returns. DOJ: no mining or trading took place. Co-founder got 12 years.","sources":["https://www.justice.gov/usao-sdny/pr/co-founder-global-multimillion-dollar-cryptocurrency-ponzi-scheme-airbit-club"],"archive":"https://web.archive.org/web/20170604042944/http://airbitclub.com/","img":"img/airbitclub.jpg"},{"id":"ormeus","answer":"scam","stamp":"FRAUD","fact":"Coin \"backed by industrial crypto mining\". SEC: $124M raised; claimed a $250M mining operation that made under $3M.","sources":["https://www.sec.gov/newsroom/press-releases/2022-37"],"archive":"https://web.archive.org/web/20180603012335/http://www.ormeuscoin.com/","img":"img/ormeus.jpg"},{"id":"tradersdomain","answer":"scam","stamp":"PONZI","fact":"Forex and gold trading platform. CFTC: falsified trading records; 2,000+ customers deposited $283M+.","sources":["https://www.cftc.gov/PressRoom/PressReleases/8997-24"],"archive":"https://web.archive.org/web/20220527161622/https://thetradersdomain.com/","img":"img/tradersdomain.jpg"},{"id":"coindeal","answer":"scam","stamp":"FRAUD","fact":"Crypto exchange token. SEC: claimed its tech would sell for trillions; $45M+ raised, no sale ever happened.","sources":["https://www.sec.gov/newsroom/press-releases/2023-2"],"archive":"https://web.archive.org/web/20210603160557/https://coindeal.com/","img":"img/coindeal.jpg"},{"id":"amlbitcoin","answer":"scam","stamp":"CONVICTED","fact":"Pitched as an \"anti-money laundering\" bitcoin. DOJ: faked a Panama Canal deal; ~$10M taken. Founder got 7 years.","sources":["https://www.justice.gov/usao-ndca/pr/founder-and-ceo-aml-bitcoin-sentenced-seven-years-prison-multi-million-dollar-fraud"],"archive":"https://web.archive.org/web/20190531215633/http://amlbitcoin.com/","img":"img/amlbitcoin.jpg"},{"id":"jibo","answer":"startup","stamp":"SHUT DOWN","fact":"Billed as the first social robot for the home. ~$3.7M crowdfunded, ~$73M from VCs, $899 at launch. Its servers went dark in 2019.","sources":["https://www.bbc.com/news/technology-47454599"],"archive":"https://web.archive.org/web/20180305014916/https://www.jibo.com/","img":"img/jibo.jpg"},{"id":"juno","answer":"startup","stamp":"ACQUIRED","fact":"NYC ride-hailing that promised drivers half of the founders' equity. Bought by Gett in 2017 for $200M.","sources":["https://en.wikipedia.org/wiki/Juno_(company)"],"archive":"https://web.archive.org/web/20170215130905/https://www.gojuno.com/","img":"img/juno.jpg"},{"id":"hellosense","answer":"startup","stamp":"SHUT DOWN","fact":"A bedside orb that tracks your sleep. $2.4M from 19,000+ Kickstarter backers. Shut down in June 2017.","sources":["https://en.wikipedia.org/wiki/Hello_(company)"],"archive":"https://web.archive.org/web/20170216220737/http://hello.is/","img":"img/hellosense.jpg"},{"id":"luxe","answer":"startup","stamp":"ACQUIRED","fact":"On-demand valets who park, fuel and wash your car. Stopped valet service in April 2017; Volvo bought it months later.","sources":["https://en.wikipedia.org/wiki/Luxe_(company)"],"archive":"https://web.archive.org/web/20160604172932/http://luxe.com/","img":"img/luxe.jpg"},{"id":"vessyl","answer":"startup","stamp":"NEVER SHIPPED","fact":"A smart cup that tells you exactly what you're drinking. Announced 2014; shipping slipped again and again and it never came out.","sources":["https://en.wikipedia.org/wiki/Vessyl"],"archive":"https://web.archive.org/web/20150528020540/http://myvessyl.com/","img":"img/vessyl.jpg"},{"id":"slync","answer":"both","stamp":"CONVICTED","fact":"Logistics software that raised ~$67M. SEC: the CEO inflated revenue and diverted $28M+, including a $16M private jet. 20 years.","sources":["https://www.sec.gov/newsroom/press-releases/2023-26","https://www.ca5.uscourts.gov/opinions/pub/24/24-10644-CR0.pdf"],"archive":"https://web.archive.org/web/20211226035645/https://www.slync.io/","img":"img/slync.jpg"},{"id":"controlfin","answer":"scam","stamp":"$571M JUDGMENT","fact":"Bitcoin \"trading\" with guaranteed daily profits. CFTC: it made no trades and posted fake trade reports; ~$143M in bitcoin, $13K returned.","sources":["https://www.cftc.gov/PressRoom/PressReleases/8371-21","https://www.cftc.gov/PressRoom/PressReleases/7938-19"],"archive":"https://web.archive.org/web/20170902074045/https://control-finance.com/","img":"img/controlfin.jpg"},{"id":"blockstream","answer":"startup","stamp":"UNICORN","fact":"Bitcoin infrastructure, including broadcasting the whole blockchain from satellites. $21M seed in 2014; valued at $3.2B in 2021.","sources":["https://en.wikipedia.org/wiki/Blockstream"],"archive":"https://web.archive.org/web/20180602230550/http://www.blockstream.com/","img":"img/blockstream.jpg"},{"id":"bitpay","answer":"startup","stamp":"STILL RUNNING","fact":"Lets shops accept bitcoin at checkout. Raised $30M in 2014; Steam and AMC Theatres later took payments through it.","sources":["https://en.wikipedia.org/wiki/BitPay"],"archive":"https://web.archive.org/web/20140602064735/http://www.bitpay.com/","img":"img/bitpay.jpg"},{"id":"celo","answer":"startup","stamp":"FUNDED","fact":"A mobile-first blockchain: send stablecoins to any phone number. Andreessen Horowitz bought $15M of its token in 2019.","sources":["https://blog.celo.org/the-celo-community-grows-ahead-of-testnet-launch-2f901ae6e309","https://www.theblock.co/news/business/2019-04-02-crypto-startup-celo-raises-30-million-in-funding-18155"],"archive":"https://web.archive.org/web/20210228125653/https://celo.org/","img":"img/celo.jpg"},{"id":"bitwage","answer":"startup","stamp":"FUNDED","fact":"Get your salary in bitcoin without your employer signing up. Raised a $760K seed in 2015 from backers incl. Draper Associates and Orange.","sources":["https://www.coindesk.com/markets/2015/11/19/bitcoin-payroll-startup-bitwage-raises-760k","https://bitwage.com/en-us/blog/bitwage-raises-760k-seed-round-to-build-the-future-of-payroll"],"archive":"https://web.archive.org/web/20170603083216/https://www.bitwage.com/","img":"img/bitwage.jpg"}];

function getSeen(){try{return JSON.parse(localStorage.getItem("sos_seen")||"[]")}catch(e){return []}}
function addSeen(id){try{const s=getSeen();if(!s.includes(id)){s.push(id);localStorage.setItem("sos_seen",JSON.stringify(s))}}catch(e){}}
function build(){const ids=new Set(R.map(r=>r.id));let seen=getSeen().filter(x=>ids.has(x));if(seen.length>=R.length){seen=[];try{localStorage.removeItem("sos_seen")}catch(e){}}const sn=new Set(seen);const un=t=>shuf(R.filter(r=>r.answer===t&&!sn.has(r.id)));const q={both:Math.random()<0.5?1:2,scam:4};q.startup=N-q.both-q.scam;const pools={startup:un("startup"),scam:un("scam"),both:un("both")};let d=[];for(const t in q){d.push(...pools[t].splice(0,q[t]))}
 const rest=shuf([...pools.startup,...pools.scam,...pools.both]);while(d.length<N&&rest.length)d.push(rest.shift());const old=shuf(R.filter(r=>sn.has(r.id)));while(d.length<N&&old.length)d.push(old.shift());return shuf(d)}
function start(){deck=build();i=0;score=0;streak=0;best=0;miss=0;log=[];$("start").classList.remove("on");$("end").classList.remove("on");$("game").classList.add("on");show()}
function hud(){$("hud").textContent=`${score}/${N} · 🔥${streak}`;$("prog").style.width=(i/N*100)+"%"}
function show(){const r=deck[i];addSeen(r.id);locked=false;$("img").src=r.img;$("stamp").className="stamp";$("stamp").textContent="";$("rev").classList.remove("on");$("toast").textContent="";
 ["bScam","bStart"].forEach(b=>{$(b).disabled=false;$(b).classList.remove("picked")});hud();
 if(deck[i+1]){const p=new Image();p.src=deck[i+1].img}}
function guess(g){if(locked)return;locked=true;const r=deck[i];const ok=r.answer==="both"||r.answer===g;
 if(ok){score++;streak++;best=Math.max(best,streak);miss=0}else{streak=0;miss++;$("shot").classList.remove("shake");void $("shot").offsetWidth;$("shot").classList.add("shake")}
 log.push(r.answer==="both"?"🤡":ok?"🟩":"🟥");
 $(g==="scam"?"bScam":"bStart").classList.add("picked");["bScam","bStart"].forEach(b=>$(b).disabled=true);
 const st=$("stamp");st.textContent=r.stamp;st.style.color=r.answer==="startup"?"var(--grn)":r.answer==="both"?"var(--ylw)":"var(--red)";void st.offsetWidth;st.classList.add("on");
 $("verdict").textContent=r.answer==="both"?"BOTH 🤡":ok?pick(RIGHT):pick(WRONG);$("verdict").className="verdict "+(ok?"ok":"no");
 $("ans").textContent=r.answer==="both"?"funded AND charged":r.answer==="scam"?"🚩 SCAM":"🚀 STARTUP";
 $("fact").textContent=r.fact;
 $("src").innerHTML=r.sources.map((u,k)=>`<a href="${u}" target="_blank" rel="noopener">source${r.sources.length>1?" "+(k+1):""}</a>`).join(" · ")+` · <a href="${r.archive}" target="_blank" rel="noopener">archive</a>`;
 $("toast").textContent=ok?(HYPE[streak]||""):(COPE[Math.min(miss,5)]||"");
 $("rev").classList.add("on");hud();$("next").textContent=i===N-1?"RESULTS →":"NEXT →";$("next").focus({preventScroll:true});
 $("rev").scrollIntoView({behavior:"smooth",block:"nearest"})}
function next(){if(!locked)return;i++;if(i>=N)return end();show();window.scrollTo({top:0,behavior:"smooth"})}
function end(){$("game").classList.remove("on");$("end").classList.add("on");$("prog").style.width="100%";
 $("fscore").textContent=`${score}/${N}`;$("frank").textContent=RANKS.find(x=>score>=x[0])[1];
 $("fsub").textContent=`best streak ${best}`;$("fgrid").textContent=log.join("")}
async function share(){const txt=`I scored ${score}/${N} on Scam or Startup 🚩\n${RANKS.find(x=>score>=x[0])[1]}\n${log.join("")}\n${location.href.startsWith("http")?location.href:""}`.trim();
 try{if(navigator.share&&/Mobi/i.test(navigator.userAgent)){await navigator.share({text:txt});return}await navigator.clipboard.writeText(txt);$("shareBtn").textContent="COPIED ✅"}catch(e){$("shareBtn").textContent="COPY FAILED"}
 setTimeout(()=>$("shareBtn").textContent="SHARE 🚩",1800)}
$("goBtn").onclick=start;$("againBtn").onclick=start;$("bScam").onclick=()=>guess("scam");$("bStart").onclick=()=>guess("startup");$("next").onclick=next;$("shareBtn").onclick=share;
document.addEventListener("keydown",e=>{const k=e.key.toLowerCase();
 if($("start").classList.contains("on")||$("end").classList.contains("on")){if(k==="enter"){e.preventDefault();start()}return}
 if(!locked){if(k==="s"||k==="arrowleft"||k==="1")guess("scam");else if(k==="d"||k==="arrowright"||k==="2")guess("startup")}
 else if(k==="enter"||k===" "||k==="n"||k==="arrowright"){e.preventDefault();next()}});
</script><script>
(function(){const z=document.getElementById("zoom"),zi=document.getElementById("zimg");
document.getElementById("img").addEventListener("click",e=>{zi.src=e.target.src;z.classList.add("on");z.scrollLeft=0;z.scrollTop=0});
document.getElementById("zx").addEventListener("click",e=>{e.stopPropagation();z.classList.remove("on")});
z.addEventListener("click",e=>{if(e.target===z)z.classList.remove("on")});})();
</script></body></html>
