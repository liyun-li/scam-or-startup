<style>
:root{--red:#ff2e4d;--grn:#19e07a;--ylw:#ffd400;--bg:#0b0b0f;--card:#16161d}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:#fff;font-family:Impact,"Anton","Arial Black",system-ui,sans-serif;display:flex;justify-content:center;overflow-x:hidden}
.app{width:100%;max-width:560px;min-height:100%;display:flex;flex-direction:column;padding:12px 14px calc(14px + env(safe-area-inset-bottom));gap:12px}

.shot{position:relative;border-radius:14px;overflow:hidden;background:#000;border:3px solid #2a2a35;box-shadow:0 10px 40px #0008;flex:none}
.vp{position:relative;overflow:hidden;background:#fff;aspect-ratio:16/10;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

.vp img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:top;display:block;transform-origin:0 0;will-change:transform;-webkit-user-drag:none}
.shot .chrome{height:18px;background:#d9d9de;display:flex;gap:5px;align-items:center;padding-left:8px}

button{font-family:inherit;border:0;cursor:pointer;color:#fff;border-radius:16px;font-size:clamp(26px,8vw,40px);padding:18px 6px;letter-spacing:1px;box-shadow:0 6px 0 #0009;transition:transform .08s}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #0009}
.scam{background:var(--red)}.startup{background:var(--grn);color:#062}
button small{display:block;font-family:system-ui;font-size:11px;opacity:.7;letter-spacing:0;margin-top:2px}

.rev{display:none;text-align:center;gap:6px;flex-direction:column;align-items:center}

.verdict.ok{color:var(--grn)}.verdict.no{color:var(--red)}
.ans{font-size:22px;letter-spacing:1px}
.fact{font-family:system-ui,sans-serif;font-weight:700;font-size:16px;color:#ddd;max-width:440px}
.src{font-family:system-ui;font-size:11px;color:#777}.src a{color:#999}
.next{background:#fff;color:#000;width:100%;margin-top:6px;font-size:28px;padding:14px}
.toast{font-size:20px;color:var(--ylw);min-height:24px;text-align:center}
.screen{display:none;flex-direction:column;gap:14px;align-items:center;text-align:center;justify-content:center;flex:1}
.screen.on{display:flex}
.big{font-size:clamp(54px,17vw,96px);line-height:.9}.big b{color:var(--red)}.big i{font-style:normal;color:var(--grn)}
.sub{font-family:system-ui;font-weight:700;color:#aaa;font-size:15px}
.go{background:var(--ylw);color:#000;font-size:34px;padding:16px 40px}
.score{font-size:96px;line-height:1}.rank{font-size:34px;color:var(--ylw)}
.grid{font-size:26px;letter-spacing:2px}
.row{display:flex;gap:10px;width:100%}.row button{flex:1;font-size:24px;padding:14px}
.share{background:var(--red)}.again{background:#2a2a35}
.shake{animation:sh .35s}@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#game{display:none;flex-direction:column;gap:12px}#game.on{display:flex}
.foot{font-family:system-ui;font-size:10px;color:#555;text-align:center;margin-top:auto}

.vp img{cursor:zoom-in}
.zoom{position:fixed;inset:0;background:#000f;z-index:99;display:none;overscroll-behavior:contain}

.zoom .x:active{transform:scale(.92);box-shadow:0 2px 10px #0008}
.zoom .x svg{display:block;width:18px;height:18px}
.ms{display:none}@media (hover:hover) and (pointer:fine){.ms{display:inline}.tch{display:none}}
.zhint{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);color:#fff9;font:700 12px system-ui;pointer-events:none;white-space:nowrap}
@media (hover:none),(pointer:coarse){button small{display:none}.zhint .tch{display:none}}
.toast:empty{display:none}
@media(max-width:699px){
.app{min-height:100vh;min-height:100dvh;padding-top:calc(10px + env(safe-area-inset-top));padding-left:calc(14px + env(safe-area-inset-left));padding-right:calc(14px + env(safe-area-inset-right))}
#game.on{flex:1}
#game .shot{margin:auto 0}
#game .vp{width:100%}
#game .vp img{height:auto;aspect-ratio:16/10;object-fit:fill}
#game .btns{gap:12px}
#game .btns button{height:clamp(84px,17dvh,160px);padding:0 4px;font-size:clamp(24px,7.4vw,36px);white-space:nowrap}
#game.done .btns{display:none}
#game .rev{gap:4px}
#game .verdict{font-size:clamp(38px,12vw,60px)}
#game .fact{font-size:15px}
#game .next{margin-top:8px;padding:18px}
#game .toast{font-size:18px;min-height:0}
.foot{padding-top:2px}
}
.hint{position:absolute;bottom:8px;right:8px;z-index:1;background:#000a;color:#fff;font:700 12px system-ui;padding:4px 8px;border-radius:10px;pointer-events:none}

@media(min-width:1000px){
.app{max-width:1500px;padding-left:32px;padding-right:32px}

#game .vp{max-height:calc(100vh - 160px)}
#game .btns{grid-column:2;grid-row:1;grid-template-columns:1fr;gap:14px}

#game .toast{grid-column:2;grid-row:2}
#game .rev{grid-column:2;grid-row:3}
#game .next{width:100%}
}
@media(min-width:700px){
.app{gap:16px}
.shot{border-radius:18px}
#btns button,.go{font-size:clamp(28px,3vw,44px)}
#rev .verdict,#verdict{font-size:clamp(48px,6vw,84px)}
.fact{font-size:clamp(16px,1.4vw,22px);max-width:760px}
}

t.","sources":["https://en.wikipedia.org/wiki/HyperVerse","https://www.sec.gov/newsroom/press-releases/2024-11","https://www.fca.org.uk/news/warnings/hyperfund-hyperverse-hypernation-hypercommunity"],"archive":"https://web.archive.org/web/20220205115558/https://thehyperverse.net/","img":"img/hyperverse.jpg"},{"id":"tbis","answer":"scam","stamp":"FAKE","fact":"Claimed ties to PayPal, Disney & the Fed. SEC halted it.","sources":["https://www.sec.gov/newsroom/press-releases/2018-94"],"archive":"https://web.archive.org/web/20171210111550/http://www.tbis.io/","img":"img/tbis.jpg"},{"id":"zeekrewards","answer":"scam","stamp":"PONZI","fact":"SEC: $600M Ponzi. ~98% of revenue came from new investors.","sources":["https://www.sec.gov/newsroom/press-releases/2012-2012-160htm"],"archive":"https://web.archive.org/web/20120301074133/http://zeekrewards.com/","img":"img/zeekrewards.jpg"},{"id":"vemma","answer":"scam","stamp":"PYRAMID","fact":"Energy drinks. The FTC shut it down as a pyramid scheme in 2015.","sources":["https://en.wikipedia.org/wiki/Vemma"],"archive":"https://web.archive.org/web/20150603075612/http://www.vemma.com/","img":"img/vemma.jpg"},{"id":"bancdebinary","answer":"scam","stamp":"BANNED","fact":"Binary options. Paid $11M to settle US charges. Banned in several countries.","sources":["https://en.wikipedia.org/wiki/Banc_De_Binary"],"archive":"https://web.archive.org/web/20130604010346/http://www.bancdebinary.com/","img":"img/bancdebinary.jpg"},{"id":"woodbridge","answer":"scam","stamp":"PONZI","fact":"SEC: $1.2B Ponzi scheme. Over 8,400 investors, many of them seniors.","sources":["https://www.sec.gov/newsroom/press-releases/2017-235"],"archive":"https://web.archive.org/web/20170530195324/http://woodbridgecompanies.com/","img":"img/woodbridge.jpg"},{"id":"arisebank","answer":"scam","stamp":"HALTED","fact":"\"Decentralized bank\" ICO. SEC halted it; it falsely claimed to own an FDIC-insured bank.","sources":["https://www.sec.gov/newsroom/press-releases/2018-8"],"a attle investments paying 15-32% a year. SEC: a $191M Ponzi scheme.","sources":["https://www.sec.gov/newsroom/press-releases/2023-250"],"archive":"https://web.archive.org/web/20230620210935/https://www.agridime.com/","img":"img/agridime.jpg"},{"id":"gpb","answer":"scam","stamp":"PONZI-LIKE","fact":"Private equity paying 8% a year. SEC: $1.7B \"Ponzi-like scheme\", 17,000+ investors.","sources":["https://www.sec.gov/newsroom/press-releases/2021-24"],"archive":"https://web.archive.org/web/20190113123520/http://www.gpb-cap.com/","img":"img/gpb.jpg"},{"id":"dcsolar","answer":"scam","stamp":"PONZI","fact":"Mobile solar generators. Up to three-quarters of them never existed. ~$1B Ponzi.","sources":["https://en.wikipedia.org/wiki/DC_Solar"],"archive":"https://web.archive.org/web/20180804162443/http://dcsolar.com/","img":"img/dcsolar.jpg"},{"id":"withfrank","answer":"both","stamp":"CONVICTED","fact":"Sold to JPMorgan for $175M. Founder convicted of fraud.","sources":["https://en.wikipedia.org/wiki/Charlie_Javice"],"archive":"https://web.archive.org/web/20201101134313/https://withfrank.org/","img":"img/withfrank.jpg"},{"id":"headspin","answer":"both","stamp":"CHARGED","fact":"Valued at ~$1.1B. Reported $95.3M revenue; DOJ says real was $26.3M.","sources":["https://www.justice.gov/usao-ndca/pr/co-founder-and-former-ceo-palo-alto-based-start-technology-company-headspin-charged"],"archive":"https://web.archive.org/web/20200530104609/https://www.headspin.io/","img":"img/headspin.jpg"},{"id":"ubiome","answer":"both","stamp":"RAIDED","fact":"Microbiome testing startup. FBI raid, bankruptcy, founders charged.","sources":["https://en.wikipedia.org/wiki/UBiome"],"archive":"https://web.archive.org/web/20180601103805/https://ubiome.com/","img":"img/ubiome.jpg"},{"id":"joonko","answer":"both","stamp":"CHARGED","fact":"AI diversity hiring. SEC: founder used fake customers and forged bank statements.","sources":["https://www.sec.gov/newsroom/press-releases/2024-70"],"archive":"https://web.archive.org/web/20210507194005/https://joonko.co/","img":"img/joonko.jpg"},{"id":"nate","answer":"both","stamp":"CHARGED","fact":"\"AI\" shopping app. DOJ: automation was ~0%; humans in the Philippines did it.","sources":["https://www.justice.gov/usao-sdny/pr/tech-ceo-charged-artificial-intelligence-investment-fraud-scheme"],"archive":"https://web.archive.org/web/20210610222441/https://www.nate.tech/","img":"img/nate.jpg"},{"id":"ozy","answer":"both","stamp":"CONVICTED","fact":"Media startup. Company and co-founder convicted of fraud in 2024.","sources":["https://en.wikipedia.org/wiki/Ozy_Media"],"archive":"https://web.archive.org/web/20200602054711/https://www.ozy.com/","img":"img/ozy.jpg"},{"id":"quadrigacx","answer":"both","stamp":"PONZI","fact":"Canadian crypto exchange. Regulator later called it a fraud and Ponzi.","sources":["https://en.wikipedia.org/wiki/Quadriga_(cryptocurrency_exchange)"],"archive":"https://web.archive.org/web/20180604145317/http://quadrigacx.com/","img":"img/quadrigacx.jpg"},{"id":"fast","answer":"startup","stamp":"DEAD","fact":"Raised $124M. Six-figure revenue. Burned ~$10M a month. Dead 2022.","sources":["https://techcrunch.com/2022/04/05/fast-shuts-doors-after-slow-growth-high-burn-precluded-fundraising-options/"],"archive":"https://web.archive.org/web/20210303083011/http://fast.co/","img":"img/fast.jpg"},{"id":"thodex","answer":"scam","stamp":"EXIT SCAM","fact":"Turkish exchange. Owner fled with about $2B. Sentenced to 11,196 years.","sources":["https://en.wikipedia.org/wiki/Thodex"],"archive":"https://web.archive.org/web/20210320131125/https://www.thodex.com/tr","img":"img/thodex.jpg"},{"id":"wcm777","answer":"scam","stamp":"PONZI","fact":"Promised 100% in 100 days. SEC: Ponzi. Money went to golf courses.","sources":["https://www.sec.gov/newsroom/press-releases/2014-60"],"archive":"https://web.archive.org/web/20131201075427/http://www.wcm777.hk/","img":"img/wcm777.jpg"},{"id":"gawminers","answer":"scam","stamp":"PONZI","fact":"SEC: sold shares of mining power that never existed.","sources":["https://www.sec.gov/newsroom/press-releases/2015-271"],"archive":"https://web.archive.org/web/20141207195530/https://gawminers.com/","img":"img/gawminers.jpg"},{"id":"driveplanning","answer":"scam","stamp":"PONZI","fact":"Promised 10% every 3 months on real estate. SEC: $300M Ponzi, a $3.1M yacht.","sources":["https://www.sec.gov/newsroom/press-releases/2024-97"],"archive":"https://web.archive.org/web/20220531221218/https://driveplanning.com/","img":"img/driveplanning.jpg"},{"id":"hashflare","answer":"scam","stamp":"PONZI","fact":"Cloud crypto mining. DOJ: $577M in sales, dashboards showed fake mining data.","sources":["https://www.justice.gov/opa/pr/two-estonian-nationals-plead-guilty-577m-cryptocurrency-fraud-scheme"],"archive":"https://web.archive.org/web/20180601221525/https://www.hashflare.io/","img":"img/hashflare.jpg"},{"id":"novatech","answer":"scam","stamp":"FRAUD","fact":"SEC: $650M fraud on 200,000+ investors.","sources":["https://www.sec.gov/newsroom/press-releases/2024-95"],"archive":"https://web.archive.org/web/20220526021208/http://novatechfx.com/","img":"img/novatech.jpg"},{"id":"eminifx","answer":"scam","stamp":"FRAUD","fact":"\"AI Robo-Advisor\" promised 5% a week. CEO got 9 years.","sources":["https://www.justice.gov/usao-sdny/pr/ceo-cryptocurrency-and-forex-trading-platform-sentenced-nine-years-prison-240-million"],"archive":"https://web.archive.org/web/20220516122343/http://eminifx.com/","img":"img/eminifx.jpg"},{"id":"usitech","answer":"scam","stamp":"PONZI","fact":"Bitcoin \"trading bot\". Texas regulators: Ponzi hallmarks.","sources":["https://en.wikipedia.org/wiki/USI_Tech"],"archive":"https://web.archive.org/web/20171231223804/http://usitech-int.com/","img":"img/usitech.jpg"},{"id":"meta1","answer":"scam","stamp":"FRAUD","fact":"SEC: claimed backing by a $1B art collection. Promised up to 224,923% returns.","sources":["https://www.sec.gov/newsroom/press-releases/2020-66"],"archive":"https://web.archive.org/web/20200311012436/https://www.meta1.io/","img":"img/meta1.jpg"},{"id":"kubient","answer":"both","stamp":"GUILTY","fact":"Nasdaq ad-tech IPO touting an \"AI\" fraud detector. Founder pleaded guilty: the AI never scanned the client data.","sources":["https://www.justice.gov/usao-sdny/pr/former-ceo-kubient-inc-charged-and-pleads-guilty-connection-accounting-fraud-scheme"],"archive":"https://web.archive.org/web/20210611123543/http://kubient.com/","img":"img/kubient.jpg"},{"id":"color","answer":"startup","stamp":"DEAD","fact":"Raised $41M before launch. Shut down in 2012.","sources":["https://en.wikipedia.org/wiki/Color_Labs"],"archive":"https://web.archive.org/web/20110629165846/http://www.color.com/","img":"img/color.jpg"},{"id":"telexfree","answer":"scam","stamp":"PYRAMID","fact":"SEC: ~$1.3M in real VoIP sales vs $1.1B promised to promoters.","sources":["https://www.sec.gov/newsroom/press-releases/2014-79"],"archive":"https://web.archive.org/web/20140202042043/http://www.telexfree.com/","img":"img/telexfree.jpg"},{"id":"outcomehealth","answer":"both","stamp":"CONVICTED","fact":"Valued at $5.6B by Goldman and others. Founders convicted of fraud.","sources":["https://en.wikipedia.org/wiki/Outcome_Health"],"archive":"https://web.archive.org/web/20170212225437/http://www.outcomehealth.com/","img":"img/outcomehealth.jpg"},{"id":"juicyfields","answer":"scam","stamp":"PONZI","fact":"Cannabis \"e-growing\". About €645M from 186,000 people.","sources":["https://en.wikipedia.org/wiki/JuicyFields"],"archive":"https://web.archive.org/web/20211016113201/https://juicyfields.io/","img":"img/juicyfields.jpg"},{"id":"aardvark","answer":"startup","stamp":"ACQUIRED","fact":"Social Q&A search engine. Google paid $50M in 2010.","sources":["https://en.wikipedia.org/wiki/Aardvark_(search_engine)"],"archive":"https://web.archive.org/web/20100102003413/http://vark.com/","img":"img/aardvark.jpg"},{"id":"betterplace","answer":"startup","stamp":"BANKRUPT","fact":"Battery-swap stations for electric cars. Spent about $850M. Bankrupt in 2013.","sources":["https://en.wikipedia.org/wiki/Better_Place_(company)"],"archive":"https://web.archive.org/web/20120604045936/http://www.betterplace.com/","img":"img/betterplace.jpg"},{"id":"brandless","answer":"startup","stamp":"FUNDED","fact":"Everything for $3. Raised $240M in a 2019 round. The CEO stepped down after friction with SoftBank.","sources":["https://en.wikipedia.org/wiki/Brandless"],"archive":"https://web.archive.org/web/20190301210550/https://brandless.com/","img":"img/brandless.jpg"},{"id":"bump","answer":"startup","stamp":"ACQUIRED","fact":"Bump-your-phones sharing app. Google bought it in 2013 and killed it in 2014.","sources":["https://en.wikipedia.org/wiki/Bump_(application)"],"archive":"https://web.archive.org/web/20130302055026/http://bu.mp/","img":"img/bump.jpg"},{"id":"diaspora","answer":"startup","stamp":"CROWDFUNDED","fact":"NYU students' anti-Facebook social network. Raised $200K+ on Kickstarter.","sources":["https://en.wikipedia.org/wiki/Diaspora_(social_network)"],"archive":"https://web.archive.org/web/20120528071957/https://www.joindiaspora.com/","img":"img/diaspora.jpg"},{"id":"dodgeball","answer":"startup","stamp":"ACQUIRED","fact":"Mobile check-in service. Google bought it in 2005 and shut it in 2009. A founder then built Foursquare.","sources":["https://en.wikipedia.org/wiki/Dodgeball_(service)"],"archive":"https://web.archive.org/web/20050602003940/http://dodgeball.com/","img":"img/dodgeball.jpg"},{"id":"doppler","answer":"startup","stamp":"DEAD","fact":"Earbuds billed as the \"world's first in-ear computer\". Raised $50M+. Shut down when it couldn't raise a Series C.","sources":["https://en.wikipedia.org/wiki/Doppler_Labs"],"archive":"https://web.archive.org/web/20170602034215/https://www.dopplerlabs.com/","img":"img/doppler.jpg"},{"id":"ello","answer":"startup","stamp":"INVITE-ONLY","fact":"Ad-free social network with an anti-Facebook manifesto. Launched invite-only in 2014.","sources":["https://en.wikipedia.org/wiki/Ello_(social_network)"],"archive":"https://web.archive.org/web/20150602194622/http://ello.co/","img":"img/ello.jpg"},{"id":"etherpad","answer":"startup","stamp":"ACQUIRED","fact":"Real-time collaborative text editor. Google acquired it in Dec 2009.","sources":["https://en.wikipedia.org/wiki/Etherpad"],"archive":"https://web.archive.org/web/20090604095353/http://etherpad.com/","img":"img/etherpad.jpg"},{"id":"gowalla","answer":"startup","stamp":"ACQUIRED","fact":"Location check-in app. Facebook acquired it in Dec 2011.","sources":["https://en.wikipedia.org/wiki/Gowalla"],"archive":"https://web.archive.org/web/20110602053725/http://gowalla.com/","img":"img/gowalla.jpg"},{"id":"hailo","answer":"startup","stamp":"MERGED","fact":"Taxi-hailing app in 16 cities. Absorbed into Daimler-owned myTaxi in 2016.","sources":["https://en.wikipedia.org/wiki/Hailo"],"archive":"https://web.archive.org/web/20130607022406/http://hailoapp.com/","img":"img/hailo.jpg"},{"id":"jaiku","answer":"startup","stamp":"ACQUIRED","fact":"Finnish microblogging with a Nokia app. Google bought it in 2007.","sources":["https://en.wikipedia.org/wiki/Jaiku"],"archive":"https://web.archive.org/web/20070531174807/http://www.jaiku.com/","img":"img/jaiku.jpg"},{"id":"jelly","answer":"startup","stamp":"ACQUIRED","fact":"Ask a question with a photo; strangers answer. Pinterest acquired it in 2017.","sources":["https://en.wikipedia.org/wiki/Jelly_(app)"],"archive":"https://web.archive.org/web/20140602031731/http://jelly.co/","img":"img/jelly.jpg"},{"id":"katerra","answer":"startup","stamp":"BANKRUPT","fact":"Construction startup. SoftBank's Vision Fund put in more than $2B. Bankrupt in 2021.","sources":["https://en.wikipedia.org/wiki/Katerra"],"archive":"https://web.archive.org/web/20200527053358/https://www.katerra.com/","img":"img/katerra.jpg"},{"id":"loopt","answer":"startup","stamp":"ACQUIRED","fact":"See where your friends are. Raised $30M+. Sold for $43.4M in 2012.","sources":["https://en.wikipedia.org/wiki/Loopt"],"archive":"https://web.archive.org/web/20090604095405/http://www.loopt.com//","img":"img/loopt.jpg"},{"id":"mailbox","answer":"startup","stamp":"ACQUIRED","fact":"Swipe-to-clear email app. Dropbox bought its maker in 2013, killed the app in 2015.","sources":["https://en.wikipedia.org/wiki/Mailbox_(application)"],"archive":"https://web.archive.org/web/20130601110316/http://www.mailboxapp.com/","img":"img/mailbox.jpg"},{"id":"meerkat","answer":"startup","stamp":"DEAD","fact":"Live-stream video app. Blew up on launch in Feb 2015. Shut down Oct 2016.","sources":["https://en.wikipedia.org/wiki/Meerkat_(app)"],"archive":"https://web.archive.org/web/20150602181118/http://meerkatapp.co/","img":"img/meerkat.jpg"},{"id":"path","answer":"startup","stamp":"DEAD","fact":"Social network capped at 50 friends. Raised $30M from Redpoint. Shut down in 2018.","sources":["https://en.wikipedia.org/wiki/Path_(social_network)"],"archive":"https://web.archive.org/web/20131001210824/https://path.com/","img":"img/path.jpg"},{"id":"powerset","answer":"startup","stamp":"ACQUIRED","fact":"Natural-language search over Wikipedia. Microsoft paid about $100M in 2008.","sources":["https://en.wikipedia.org/wiki/Powerset_(company)"],"archive":"https://web.archive.org/web/20080601183511/http://www.powerset.com/","img":"img/powerset.jpg"},{"id":"pownce","answer":"startup","stamp":"DEAD","fact":"Send files, links and events to friends. Acquired in Dec 2008 and shut down two weeks later.","sources":["https://en.wikipedia.org/wiki/Pownce"],"archive":"https://web.archive.org/web/20080229023731/http://pownce.com/","img":"img/pownce.jpg"},{"id":"rdio","answer":"startup","stamp":"BANKRUPT","fact":"Music streaming. Bankrupt in 2015; Pandora bought its assets for $75M.","sources":["https://en.wikipedia.org/wiki/Rdio"],"archive":"https://web.archive.org/web/20130601052553/http://www.rdio.com/","img":"img/rdio.jpg"},{"id":"sidecar","answer":"startup","stamp":"DEAD","fact":"Ridesharing pioneer. Fined $20,000 by California regulators in 2012. Shut down Dec 2015.","sources":["https://en.wikipedia.org/wiki/Sidecar_(company)"],"archive":"https://web.archive.org/web/20150302160302/http://www.side.cr/","img":"img/sidecar.jpg"},{"id":"socialcam","answer":"startup","stamp":"ACQUIRED","fact":"Video sharing app. 16M downloads. Autodesk paid $60M in 2012.","sources":["https://en.wikipedia.org/wiki/Socialcam"],"archive":"https://web.archive.org/web/20120525092223/http://socialcam.com/","img":"img/socialcam.jpg"},{"id":"turntable","answer":"startup","stamp":"DEAD","fact":"Raised $7M at a $35M valuation in 2011. Shut down in Dec 2013.","sources":["https://en.wikipedia.org/wiki/Turntable.fm"],"archive":"https://web.archive.org/web/20130317104337/http://turntable.fm/","img":"img/turntable.jpg"},{"id":"zirtual","answer":"startup","stamp":"PAUSED","fact":"Virtual assistants for busy founders. Raised a $2M seed. Paused all operations overnight in Aug 2015.","sources":["https://en.wikipedia.org/wiki/Zirtual"],"archive":"https://web.archive.org/web/20140605173932/https://www.zirtual.com/","img":"img/zirtual.jpg"},{"id":"xobni","answer":"startup","stamp":"ACQUIRED","fact":"\"Inbox\" spelled backwards. An Outlook plugin. Yahoo acquired it in 2013.","sources":["https://en.wikipedia.org/wiki/Xobni"],"archive":"https://web.archive.org/web/20110603234415/http://www.xobni.com/","img":"img/xobni.jpg"},{"id":"posterous","answer":"startup","stamp":"ACQUIRED","fact":"Blog by email. Twitter took much of the team in 2012; site shut 2013.","sources":["https://en.wikipedia.org/wiki/Posterous"],"archive":"https://web.archive.org/web/20110601202358/http://posterous.com/","img":"img/posterous.jpg"},{"id":"sparrow","answer":"startup","stamp":"ACQUIRED","fact":"A Mac email app. Google bought it in 2012 and stopped development.","sources":["https://en.wikipedia.org/wiki/Sparrow_(email_client)"],"archive":"https://web.archive.org/web/20120304212936/http://www.sparrowmailapp.com/","img":"img/sparrow.jpg"},{"id":"lytro","answer":"startup","stamp":"DEAD","fact":"Light-field camera: refocus after you shoot. Shut down in March 2018.","sources":["https://en.wikipedia.org/wiki/Lytro"],"archive":"https://web.archive.org/web/20120601073034/http://www.lytro.com/","img":"img/lytro.jpg"},{"id":"dropcam","answer":"startup","stamp":"$555M EXIT","fact":"Wi-Fi home cameras. Google's Nest paid $555M in 2014.","sources":["https://en.wikipedia.org/wiki/Dropcam"],"archive":"https://web.archive.org/web/20130530182852/https://www.dropcam.com/","img":"img/dropcam.jpg"},{"id":"quirky","answer":"startup","stamp":"BANKRUPT","fact":"Crowdsourced inventions. Raised $79M from GE and VCs in 2013. Bankrupt in 2015.","sources":["https://en.wikipedia.org/wiki/Quirky_(company)"],"archive":"https://web.archive.org/web/20140603064911/http://www.quirky.com/","img":"img/quirky.jpg"},{"id":"aereo","answer":"startup","stamp":"BANKRUPT","fact":"Live TV over the internet via tiny antennas. Lost at the Supreme Court in 2014; bankrupt months later.","sources":["https://en.wikipedia.org/wiki/Aereo"],"archive":"https://web.archive.org/web/20140602031732/https://aereo.com/","img":"img/aereo.jpg"},{"id":"munchery","answer":"startup","stamp":"DEAD","fact":"Chef-made dinners delivered. Raised an $85M Series C in 2015. Shut down abruptly in Jan 2019.","sources":["https://en.wikipedia.org/wiki/Munchery"],"archive":"https://web.archive.org/web/20150530212036/https://www.munchery.com/","img":"img/munchery.jpg"},{"id":"rethink","answer":"startup","stamp":"DEAD","fact":"Collaborative factory robots, starting with Baxter in 2012. Ceased operations in Oct 2018.","sources":["https://en.wikipedia.org/wiki/Rethink_Robotics"],"archive":"https://web.archive.org/web/20130603210814/http://www.rethinkrobotics.com/","img":"img/rethink.jpg"},{"id":"zume","answer":"startup","stamp":"DEAD","fact":"Pizza made by robots and baked en route to you. Pivoted to packaging, shut down in 2023.","sources":["https://en.wikipedia.org/wiki/Zume"],"archive":"https://web.archive.org/web/20190528152144/https://zumepizza.com/","img":"img/zume.jpg"},{"id":"akazoo","answer":"both","stamp":"SETTLED","fact":"Music streaming app. SEC: defrauded investors; settled for $38.8M.","sources":["https://en.wikipedia.org/wiki/InternetQ"],"archive":"https://web.archive.org/web/20190519064216/https://www.akazoo.com/","img":"img/akazoo.jpg"},{"id":"bitwise","answer":"both","stamp":"GUILTY","fact":"Tech training and coworking startup. Founders pleaded guilty to wire fraud; $115M restitution, 9 and 11 years.","sources":["https://en.wikipedia.org/wiki/Bitwise_Industries"],"archive":"https://web.archive.org/web/20210524205401/https://bitwiseindustries.com/","img":"img/bitwise.jpg"},{"id":"lily","answer":"both","stamp":"SUED","fact":"Self-flying camera drone. $34M in pre-orders. Never shipped; SF DA sued over faked demo videos.","sources":["https://en.wikipedia.org/wiki/Lily_Robotics"],"archive":"https://web.archive.org/web/20160528174222/https://www.lily.camera/","img":"img/lily.jpg"},{"id":"zenefits","answer":"both","stamp":"FINED","fact":"HR software startup, valued at $4.5B. Then California's insurance regulator fined it $7M.","sources":["https://en.wikipedia.org/wiki/TriNet_Zenefits"],"archive":"https://web.archive.org/web/20160301030200/https://www.zenefits.com/","img":"img/zenefits.jpg"},{"id":"mutualbenefits","answer":"scam","stamp":"PONZI","fact":"Buy strangers' life insurance policies. A Ponzi; investors lost about $835M.","sources":["https://en.wikipedia.org/wiki/Mutual_Benefits_Corporation"],"archive":"https://web.archive.org/web/20040206201716/http://mutualbenefitscorp.com/","img":"img/mutualbenefits.jpg"},{"id":"aequitas","answer":"both","stamp":"PONZI-LIKE","fact":"Healthcare and education receivables. SEC: hid its collapse while raising $350M; new money paid old investors.","sources":["https://www.sec.gov/newsroom/press-releases/2016-49"],"archive":"https://web.archive.org/web/20140610070757/http://www.aequitascapital.com/","img":"img/aequitas.jpg"},{"id":"parfunding","answer":"both","stamp":"INDICTED","fact":"Small-business loans, some at 400%+ interest. SEC: ~$500M from 1,200 investors. Principals indicted.","sources":["https://www.sec.gov/enforcement-litigation/litigation-releases/lr-24860","https://www.fdicoig.gov/news/investigations-press-releases/par-funding-principals-charged-securities-fraud-extortion-tax"],"archive":"https://web.archive.org/web/20200516135151/https://parfunding.com/","img":"img/parfunding.jpg"},{"id":"arbitrade","answer":"scam","stamp":"SHAM GOLD","fact":"Claimed $10B of gold bullion backed its token. SEC: the gold deal was a sham; $36.8M of tokens sold.","sources":["https://www.sec.gov/enforcement-litigation/litigation-releases/lr-25537"],"archive":"https://web.archive.org/web/20181224082749/http://arbitrade.io/","img":"img/arbitrade.jpg"},{"id":"shopin","answer":"scam","stamp":"FRAUD","fact":"Blockchain shopper profiles. SEC: raised $42M, never built a working platform; money went to rent and a dating service.","sources":["https://www.sec.gov/newsroom/press-releases/2019-259"],"archive":"https://web.archive.org/web/20180225153739/http://shopin.com/","img":"img/shopin.jpg"},{"id":"airbitclub","answer":"scam","stamp":"PYRAMID","fact":"Crypto mining & trading \"club\" with guaranteed daily returns. DOJ: no mining or trading took place. Co-founder got 12 years.","sources":["https://www.justice.gov/usao-sdny/pr/co-founder-global-multimillion-dollar-cryptocurrency-ponzi-scheme-airbit-club"],"archive":"https://web.archive.org/web/20170604042944/http://airbitclub.com/","img":"img/airbitclub.jpg"},{"id":"ormeus","answer":"scam","stamp":"FRAUD","fact":"Coin \"backed by industrial crypto mining\". SEC: $124M raised; claimed a $250M mining operation that made under $3M.","sources":["https://www.sec.gov/newsroom/press-releases/2022-37"],"archive":"https://web.archive.org/web/20180603012335/http://www.ormeuscoin.com/","img":"img/ormeus.jpg"},{"id":"tradersdomain","answer":"scam","stamp":"PONZI","fact":"Forex and gold trading platform. CFTC: falsified trading records; 2,000+ customers deposited $283M+.","sources":["https://www.cftc.gov/PressRoom/PressReleases/8997-24"],"archive":"https://web.archive.org/web/20220527161622/https://thetradersdomain.com/","img":"img/tradersdomain.jpg"},{"id":"coindeal","answer":"scam","stamp":"FRAUD","fact":"Crypto exchange token. SEC: claimed its tech would sell for trillions; $45M+ raised, no sale ever happened.","sources":["https://www.sec.gov/newsroom/press-releases/2023-2"],"archive":"https://web.archive.org/web/20210603160557/https://coindeal.com/","img":"img/coindeal.jpg"},{"id":"amlbitcoin","answer":"scam","stamp":"CONVICTED","fact":"Pitched as an \"anti-money laundering\" bitcoin. DOJ: faked a Panama Canal deal; ~$10M taken. Founder got 7 years.","sources":["https://www.justice.gov/usao-ndca/pr/founder-and-ceo-aml-bitcoin-sentenced-seven-years-prison-multi-million-dollar-fraud"],"archive":"https://web.archive.org/web/20190531215633/http://amlbitcoin.com/","img":"img/amlbitcoin.jpg"},{"id":"jibo","answer":"startup","stamp":"SHUT DOWN","fact":"Billed as the first social robot for the home. ~$3.7M crowdfunded, ~$73M from VCs, $899 at launch. Its servers went dark in 2019.","sources":["https://www.bbc.com/news/technology-47454599"],"archive":"https://web.archive.org/web/20180305014916/https://www.jibo.com/","img":"img/jibo.jpg"},{"id":"juno","answer":"startup","stamp":"ACQUIRED","fact":"NYC ride-hailing that promised drivers half of the founders' equity. Bought by Gett in 2017 for $200M.","sources":["https://en.wikipedia.org/wiki/Juno_(company)"],"archive":"https://web.archive.org/web/20170215130905/https://www.gojuno.com/","img":"img/juno.jpg"},{"id":"hellosense","answer":"startup","stamp":"SHUT DOWN","fact":"A bedside orb that tracks your sleep. $2.4M from 19,000+ Kickstarter backers. Shut down in June 2017.","sources":["https://en.wikipedia.org/wiki/Hello_(company)"],"archive":"https://web.archive.org/web/20170216220737/http://hello.is/","img":"img/hellosense.jpg"},{"id":"luxe","answer":"startup","stamp":"ACQUIRED","fact":"On-demand valets who park, fuel and wash your car. Stopped valet service in April 2017; Volvo bought it months later.","sources":["https://en.wikipedia.org/wiki/Luxe_(company)"],"archive":"https://web.archive.org/web/20160604172932/http://luxe.com/","img":"img/luxe.jpg"},{"id":"vessyl","answer":"startup","stamp":"NEVER SHIPPED","fact":"A smart cup that tells you exactly what you're drinking. Announced 2014; shipping slipped again and again and it never came out.","sources":["https://en.wikipedia.org/wiki/Vessyl"],"archive":"https://web.archive.org/web/20150528020540/http://myvessyl.com/","img":"img/vessyl.jpg"},{"id":"slync","answer":"both","stamp":"CONVICTED","fact":"Logistics software that raised ~$67M. SEC: the CEO inflated revenue and diverted $28M+, including a $16M private jet. 20 years.","sources":["https://www.sec.gov/newsroom/press-releases/2023-26","https://www.ca5.uscourts.gov/opinions/pub/24/24-10644-CR0.pdf"],"archive":"https://web.archive.org/web/20211226035645/https://www.slync.io/","img":"img/slync.jpg"},{"id":"controlfin","answer":"scam","stamp":"$571M JUDGMENT","fact":"Bitcoin \"trading\" with guaranteed daily profits. CFTC: it made no trades and posted fake trade reports; ~$143M in bitcoin, $13K returned.","sources":["https://www.cftc.gov/PressRoom/PressReleases/8371-21","https://www.cftc.gov/PressRoom/PressReleases/7938-19"],"archive":"https://web.archive.org/web/20170902074045/https://control-finance.com/","img":"img/controlfin.jpg"},{"id":"blockstream","answer":"startup","stamp":"UNICORN","fact":"Bitcoin infrastructure, including broadcasting the whole blockchain from satellites. $21M seed in 2014; valued at $3.2B in 2021.","sources":["https://en.wikipedia.org/wiki/Blockstream"],"archive":"https://web.archive.org/web/20180602230550/http://www.blockstream.
