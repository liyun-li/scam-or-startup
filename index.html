<style>
:root{--red:#ff2e4d;--grn:#19e07a;--ylw:#ffd400;--bg:#0b0b0f;--card:#16161d}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:#fff;font-family:Impact,"Anton","Arial Black",system-ui,sans-serif;display:flex;justify-content:center;overflow-x:hidden}
.app{width:100%;max-width:560px;min-height:100%;display:flex;flex-direction:column;padding:12px 14px calc(14px + env(safe-area-inset-bottom));gap:12px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:18px;letter-spacing:.5px}
.logo{font-size:22px}.logo b{color:var(--red)}.logo i{font-style:normal;color:var(--grn)}
.pill{background:#22222c;border-radius:999px;padding:6px 12px;font-family:system-ui,sans-serif;font-weight:800;font-size:14px}
.bar{height:6px;background:#22222c;border-radius:9px;overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,var(--red),var(--ylw),var(--grn));width:0;transition:width .3s}
.shot{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:16/10;border:3px solid #2a2a35;box-shadow:0 10px 40px #0008}
.shot img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.shot .chrome{position:absolute;top:0;left:0;right:0;height:18px;background:#d9d9de;display:flex;gap:5px;align-items:center;padding-left:8px}
.shot .chrome span{width:7px;height:7px;border-radius:50%;background:#ff5f57}.shot .chrome span:nth-child(2){background:#febc2e}.shot .chrome span:nth-child(3){background:#28c840}
.shot img{padding-top:18px;background:#fff}
.stamp{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-14deg) scale(3);opacity:0;border:6px solid currentColor;padding:4px 16px;font-size:clamp(34px,10vw,64px);letter-spacing:2px;border-radius:8px;background:#0007;text-shadow:0 2px 0 #000;white-space:nowrap;pointer-events:none}
.stamp.on{animation:slam .35s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes slam{to{transform:translate(-50%,-50%) rotate(-14deg) scale(1);opacity:1}}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font-family:inherit;border:0;cursor:pointer;color:#fff;border-radius:16px;font-size:clamp(26px,8vw,40px);padding:18px 6px;letter-spacing:1px;box-shadow:0 6px 0 #0009;transition:transform .08s}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #0009}
.scam{background:var(--red)}.startup{background:var(--grn);color:#062}
button small{display:block;font-family:system-ui;font-size:11px;opacity:.7;letter-spacing:0;margin-top:2px}
button[disabled]{filter:grayscale(.8) brightness(.6)}
button.picked{outline:4px solid #fff}
.rev{display:none;text-align:center;gap:6px;flex-direction:column;align-items:center}
.rev.on{display:flex}
.verdict{font-size:clamp(40px,13vw,72px);line-height:1}
.verdict.ok{color:var(--grn)}.verdict.no{color:var(--red)}
.ans{font-size:22px;letter-spacing:1px}
.fact{font-family:system-ui,sans-serif;font-weight:700;font-size:16px;color:#ddd;max-width:440px}
.src{font-family:system-ui;font-size:11px;color:#777}.src a{color:#999}
.next{background:#fff;color:#000;width:100%;margin-top:6px;font-size:28px;padding:14px}
.toast{font-size:20px;color:var(--ylw);min-height:24px;text-align:center}
.screen{display:none;flex-direction:column;gap:14px;align-items:center;text-align:center;justify-content:center;flex:1}
.screen.on{display:flex}
.big{font-size:clamp(54px,17vw,96px);line-height:.9}.big b{color:var(--red)}.big i{font-style:normal;color:var(--grn)}
.sub{font-family:system-ui;font-weight:700;color:#aaa;font-size:15px}
.go{background:var(--ylw);color:#000;font-size:34px;padding:16px 40px}
.score{font-size:96px;line-height:1}.rank{font-size:34px;color:var(--ylw)}
.grid{font-size:26px;letter-spacing:2px}
.row{display:flex;gap:10px;width:100%}.row button{flex:1;font-size:24px;padding:14px}
.share{background:var(--red)}.again{background:#2a2a35}
.shake{animation:sh .35s}@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#game{display:none;flex-direction:column;gap:12px}#game.on{display:flex}
.foot{font-family:system-ui;font-size:10px;color:#555;text-align:center;margin-top:auto}
@media(min-width:700px){.app{padding-top:28px}}

@media(max-width:699px){.shot{aspect-ratio:4/5}.shot img{object-position:top center}}
.shot img{cursor:zoom-in}
.zoom{position:fixed;inset:0;background:#000e;z-index:99;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
.zoom.on{display:block}
.zoom img{display:block;width:1280px;max-width:none;height:auto}
.zoom .x{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;background:#fff;color:#000;border:0;border-radius:50%;width:40px;height:40px;font:900 20px system-ui;z-index:100}
.hint{position:absolute;bottom:8px;right:8px;background:#000a;color:#fff;font:700 12px system-ui;padding:4px 8px;border-radius:10px;pointer-events:none}

const R=[{"id":"juicero","answer":"startup","stamp":"DEAD","fact":"Raised $120M. Packs squeezable by hand. Shut down 2017.","sources":["https://en.wikipedia.org/wiki/Juicero"],"archive":"https://web.archive.org/web/20170312231658/http://juicero.com/","img":"img/juicero.jpg"},{"id":"quibi","answer":"startup","stamp":"BURNED","fact":"Raised $1.75B. Launched Apr 2020. Dead by Dec.","sources":["https://en.wikipedia.org/wiki/Quibi","https://variety.com/2020/digital/news/quibi-officially-shuts-down-1234842926/"],"archive":"https://web.archive.org/web/20200502023752/https://quibi.com/","img":"img/quibi.jpg"},{"id":"wework","answer":"startup","stamp":"BANKRUPT","fact":"Peak valuation ~$47B. Chapter 11 in 2023.","sources":["https://www.bbc.com/news/business-49817037","https://en.wikipedia.org/wiki/WeWork"],"archive":"https://web.archive.org/web/20190802013033/http://www.wework.com/","img":"img/wework.jpg"},{"id":"pets","answer":"startup","stamp":"LIQUIDATED","fact":"IPO Feb 2000. Liquidated Nov 2000.","sources":["https://en.wikipedia.org/wiki/Pets.com"],"archive":"https://web.archive.org/web/20000520063743/http://www.pets.com/","img":"img/pets.jpg"},{"id":"humane","answer":"startup","stamp":"DISCONTINUED","fact":"Raised $230M. AI Pin killed. HP bought the rest for $116M.","sources":["https://en.wikipedia.org/wiki/Humane_Inc."],"archive":"https://web.archive.org/web/20240501164652/https://humane.com/","img":"img/humane.jpg"},{"id":"fast","answer":"startup","stamp":"DEAD","fact":"Raised $124M. Six-figure revenue. Burned ~$10M a month. Dead 2022.","sources":["https://techcrunch.com/2022/04/05/fast-shuts-doors-after-slow-growth-high-burn-precluded-fundraising-options/"],"archive":"https://web.archive.org/web/20210303083011/https://www.fast.co/","img":"img/fast.jpg"},{"id":"bodega","answer":"startup","stamp":"RENAMED","fact":"Ex-Googlers' vending box. Renamed after backlash. Dead 2020.","sources":["https://en.wikipedia.org/wiki/Stockwell_(company)"],"archive":"https://web.archive.org/web/20170916014934/http://www.bodega.ai/","img":"img/bodega.jpg"},{"id":"justyo","answer":"startup","stamp":"FUNDED","fact":"An app that only says “Yo”. Raised $1M+.","sources":["https://en.wikipedia.org/wiki/Yo_(app)"],"archive":"https://web.archive.org/web/20140801190507/http://justyo.co/","img":"img/justyo.jpg"},{"id":"webvan","answer":"startup","stamp":"BANKRUPT","fact":"$375M IPO. Lost $800M+. Bankrupt 2001.","sources":["https://en.wikipedia.org/wiki/Webvan"],"archive":"https://web.archive.org/web/20000815052645/http://www.webvan.com/","img":"img/webvan.jpg"},{"id":"bitconnect","answer":"scam","stamp":"PONZI","fact":"DOJ: alleged $2.4B Ponzi. Founder indicted, still at large.","sources":["https://www.justice.gov/archives/opa/pr/bitconnect-founder-indicted-global-24-billion-cryptocurrency-scheme","https://en.wikipedia.org/wiki/Bitconnect"],"archive":"https://web.archive.org/web/20170901185400/https://bitconnect.co/","img":"img/bitconnect.jpg"},{"id":"onecoin","answer":"scam","stamp":"PONZI","fact":"~$4B Ponzi. Founder on Europe's Most Wanted.","sources":["https://en.wikipedia.org/wiki/OneCoin"],"archive":"https://web.archive.org/web/20160602154535/http://onecoin.eu/","img":"img/onecoin.jpg"},{"id":"squidgame","answer":"scam","stamp":"RUG PULLED","fact":"Hit $2,860+. Devs vanished with ~$3.4M. Now ~$0.","sources":["https://www.cnbc.com/2021/11/02/squid-game-token-cost-one-investor-28000-after-coin-plunged.html","https://www.wired.com/story/squid-game-coin-crypto-scam/"],"archive":"https://web.archive.org/web/20211031213719/https://squidgame.cash/","img":"img/squidgame.jpg"},{"id":"forsage","answer":"scam","stamp":"PYRAMID","fact":"SEC: $300M+ crypto pyramid & Ponzi.","sources":["https://www.sec.gov/newsroom/press-releases/2022-134"],"archive":"https://web.archive.org/web/20210517225452/https://forsage.io/","img":"img/forsage.jpg"},{"id":"plexcoin","answer":"scam","stamp":"FROZEN","fact":"Promised 1,354% in 29 days. SEC froze it.","sources":["https://www.sec.gov/newsroom/press-releases/2017-219"],"archive":"https://web.archive.org/web/20171003050518/http://www.plexcoin.com/","img":"img/plexcoin.jpg"},{"id":"hyperverse","answer":"scam","stamp":"PYRAMID","fact":"SEC: $1.7B HyperFund pyramid. UK FCA warned against it.","sources":["https://en.wikipedia.org/wiki/HyperVerse","https://www.sec.gov/newsroom/press-releases/2024-11","https://www.fca.org.uk/news/warnings/hyperfund-hyperverse-hypernation-hypercommunity"],"archive":"https://web.archive.org/web/20220205115558/https://thehyperverse.net/","img":"img/hyperverse.jpg"},{"id":"safemoon","answer":"scam","stamp":"FRAUD","fact":"Hit $8B market cap. CEO convicted of fraud.","sources":["https://www.justice.gov/usao-edny/pr/chief-executive-officer-digital-asset-company-found-guilty-multi-million-dollar-crypto"],"archive":"https://web.archive.org/web/20210602165346/https://safemoon.net/","img":"img/safemoon.jpg"},{"id":"tbis","answer":"scam","stamp":"FAKE","fact":"Claimed ties to PayPal, Disney & the Fed. SEC halted it.","sources":["https://www.sec.gov/newsroom/press-releases/2018-94"],"archive":"https://web.archive.org/web/20171210111550/http://www.tbis.io/","img":"img/tbis.jpg"},{"id":"celsius","answer":"both","stamp":"BANKRUPT","fact":"Bankrupt 2022. CEO got 12 years for fraud.","sources":["https://en.wikipedia.org/wiki/Celsius_Network","https://en.wikipedia.org/wiki/Alex_Mashinsky"],"archive":"https://web.archive.org/web/20190528165827/http://www.celsius.network/","img":"img/celsius.jpg"},{"id":"irl","answer":"both","stamp":"CHARGED","fact":"Raised ~$170M. SEC charged founder with fraud.","sources":["https://www.sec.gov/newsroom/press-releases/2024-92"],"archive":"https://web.archive.org/web/20220601023050/https://www.irl.com/","img":"img/irl.jpg"},{"id":"withfrank","answer":"both","stamp":"CONVICTED","fact":"Sold to JPMorgan for $175M. Founder convicted of fraud.","sources":["https://en.wikipedia.org/wiki/Charlie_Javice"],"archive":"https://web.archive.org/web/20201101134313/ 11019145303/http://stripe.com/","img":"img/stripe.jpg"},{"id":"pinterest","answer":"startup","stamp":"IPO'D","fact":"Online pinboard. IPO'd in 2019.","sources":["https://en.wikipedia.org/wiki/Pinterest"],"archive":"https://web.archive.org/web/20100613005542/http://pinterest.com/","img":"img/pinterest.jpg"},{"id":"reddit","answer":"startup","stamp":"IPO'D","fact":"Sold to Condé Nast in 2006 for $10-20M. IPO'd in 2024.","sources":["https://en.wikipedia.org/wiki/Reddit"],"archive":"https://web.archive.org/web/20050803024120/http://www.reddit.com/","img":"img/reddit.jpg"},{"id":"tinder","answer":"startup","stamp":"MATCHED","fact":"Hatched in an IAC incubator in 2012. Now a Match Group cash cow.","sources":["https://en.wikipedia.org/wiki/Tinder_(app)"],"archive":"https://web.archive.org/web/20130221022844/http://www.gotinder.com/","img":"img/tinder.jpg"},{"id":"venmo","answer":"startup","stamp":"ACQUIRED","fact":"Sold for $26.2M. A year later PayPal paid $800M for its buyer.","sources":["https://en.wikipedia.org/wiki/Venmo"],"archive":"https://web.archive.org/web/20100723013808/https://venmo.com/","img":"img/venmo.jpg"},{"id":"doordash","answer":"startup","stamp":"IPO'D","fact":"Started as PaloAltoDelivery.com. IPO raised $3.37B.","sources":["https://en.wikipedia.org/wiki/DoorDash"],"archive":"https://web.archive.org/web/20130517054729/http://paloaltodelivery.com/","img":"img/doordash.jpg"},{"id":"instacart","answer":"startup","stamp":"IPO'D","fact":"Groceries via app. IPO'd in 2023 at about $10B.","sources":["https://en.wikipedia.org/wiki/Instacart"],"archive":"https://web.archive.org/web/20120904043041/http://www.instacart.com/","img":"img/instacart.jpg"},{"id":"discord","answer":"startup","stamp":"200M USERS","fact":"Its makers' video game flopped. The chat app hit 200M monthly users.","sources":["https://en.wikipedia.org/wiki/Discord"],"archive":"https://web.archive.org/web/20150703012550/https://discordapp.com/","img":"img/discord.jpg"},{"id":"duolingo","answer":"st 805/https://ubiome.com/","img":"img/ubiome.jpg"},{"id":"joonko","answer":"both","stamp":"CHARGED","fact":"AI diversity hiring. SEC: founder used fake customers and forged bank statements.","sources":["https://www.sec.gov/newsroom/press-releases/2024-70"],"archive":"https://web.archive.org/web/20210507194005/https://joonko.co/","img":"img/joonko.jpg"},{"id":"nate","answer":"both","stamp":"CHARGED","fact":"\"AI\" shopping app. DOJ: automation was ~0%; humans in the Philippines did it.","sources":["https://www.justice.gov/usao-sdny/pr/tech-ceo-charged-artificial-intelligence-investment-fraud-scheme"],"archive":"https://web.archive.org/web/20210610222441/https://www.nate.tech/","img":"img/nate.jpg"},{"id":"ozy","answer":"both","stamp":"CONVICTED","fact":"Media startup. Company and co-founder convicted of fraud in 2024.","sources":["https://en.wikipedia.org/wiki/Ozy_Media"],"archive":"https://web.archive.org/web/20200602054711/https://www.ozy.com/","img":"img/ozy.jpg"},{"id":"mtgox","answer":"both","stamp":"BANKRUPT","fact":"Handled 70%+ of bitcoin trades. Bankrupt 2014. CEO convicted of data manipulation.","sources":["https://en.wikipedia.org/wiki/Mt._Gox"],"archive":"https://web.archive.org/web/20130112214437/https://mtgox.com/","img":"img/mtgox.jpg"},{"id":"quadrigacx","answer":"both","stamp":"PONZI","fact":"Canadian crypto exchange. Regulator later called it a fraud and Ponzi.","sources":["https://en.wikipedia.org/wiki/Quadriga_(cryptocurrency_exchange)"],"archive":"https://web.archive.org/web/20180604145317/http://quadrigacx.com/","img":"img/quadrigacx.jpg"},{"id":"ezubao","answer":"scam","stamp":"PONZI","fact":"Chinese P2P lending site. Took ~$7.6B from 900,000 investors; its own president called it a Ponzi.","sources":["https://en.wikipedia.org/wiki/Ezubao"],"archive":"https://web.archive.org/web/20150913162200/http://www.ezubao.com/","img":"img/ezubao.jpg"},{"id":"hashflare","answer":"scam","stamp":"PONZI","fact":"Cloud crypto mining. DOJ: $577M in sales, dashboards showed fake mining data.","sources":["https://www.justice.gov/opa/pr/two-estonian-nationals-plead-guilty-577m-cryptocurrency-fraud-scheme"],"archive":"https://web.archive.org/web/20170602060934/http://hashflare.io/","img":"img/hashflare.jpg"}];
const N=10;
const RIGHT=["DUE DILIGENCE","NAILED IT","CORRECT","SHARP","BASED"],WRONG=["REKT","WRONG","BAGHOLDER","OOF","DOWN BAD"];
const HYPE={3:"🔥 3 STREAK",5:"🔥🔥 SHORT SELLER ENERGY",7:"🚨 SEC WANTS YOUR NUMBER",10:"👑 FLAWLESS"};
const COPE={2:"you'd buy the dip",3:"please don't invest",4:"you ARE the exit liquidity",5:"seed round of shame"};
const RANKS=[[10,"SEC AGENT"],[9,"SHORT SELLER"],[7,"FORENSIC ACCOUNTANT"],[5,"SERIES A BAGHOLDER"],[3,"SOFTBANK PARTNER"],[1,"CRYPTO INFLUENCER"],[0,"EXIT LIQUIDITY"]];
const $=s=>document.getElementById(s);
let deck=[],i=0,score=0,streak=0,best=0,miss=0,locked=false,log=[];
const shuf=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
function getSeen(){try{return JSON.parse(localStorage.getItem("sos_seen")||"[]")}catch(e){return []}}
function addSeen(id){try{const s=getSeen();if(!s.includes(id)){s.push(id);localStorage.setItem("sos_seen",JSON.stringify(s))}}catch(e){}}
function build(){const ids=new Set(R.map(r=>r.id));let seen=getSeen().filter(x=>ids.has(x));if(seen.length>=R.length){seen=[];try{localStorage.removeItem("sos_seen")}catch(e){}}const sn=new Set(seen);const un=t=>shuf(R.filter(r=>r.answer===t&&!sn.has(r.id)));const q={both:Math.random()<0.5?1:2,scam:4};q.startup=N-q.both-q.scam;const pools={startup:un("startup"),scam:un("scam"),both:un("both")};let d=[];for(const t in q){d.push(...pools[t].splice(0,q[t]))}
 const rest=shuf([...pools.startup,...pools.scam,...pools.both]);while(d.length<N&&rest.length)d.push(rest.shift());const old=shuf(R.filter(r=>sn.has(r.id)));while(d.length<N&&old.length)d.push(old.shift());return shuf(d)}
function start(){deck=build();i=0;score=0;streak=0;best=0;miss=0;log=[];$("start").classList.remove("on");$("end").classList.remove("on");$("game").classList.add("on");show()}
function hud(){$("hud").textContent=`${score}/${N} · 🔥${streak}`;$("prog").style.width=(i/N*100)+"%"}
function show(){const r=deck[i];addSeen(r.id);locked=false;$("img").src=r.img;$("stamp").className="stamp";$("stamp").textContent="";$("rev").classList.remove("on");$("toast").textContent="";
 ["bScam","bStart"].forEach(b=>{$(b).disabled=false;$(b).classList.remove("picked")});hud();
 if(deck[i+1]){const p=new Image();p.src=deck[i+1].img}}
function guess(g){if(locked)return;locked=true;const r=deck[i];const ok=r.answer==="both"||r.answer===g;
 if(ok){score++;streak++;best=Math.max(best,streak);miss=0}else{streak=0;miss++;$("shot").classList.remove("shake");void $("shot").offsetWidth;$("shot").classList.add("shake")}
 log.push(r.answer==="both"?"🤡":ok?"🟩":"🟥");
 $(g==="scam"?"bScam":"bStart").classList.add("picked");["bScam","bStart"].forEach(b=>$(b).disabled=true);
 const st=$("stamp");st.textContent=r.stamp;st.style.color=r.answer==="startup"?"var(--grn)":r.answer==="both"?"var(--ylw)":"var(--red)";void st.offsetWidth;st.classList.add("on");
 $("verdict").textContent=r.answer==="both"?"BOTH 🤡":ok?pick(RIGHT):pick(WRONG);$("verdict").className="verdict "+(ok?"ok":"no");
 $("ans").textContent=r.answer==="both"?"funded AND charged":r.answer==="scam"?"🚩 SCAM":"🚀 STARTUP";
 $("fact").textContent=r.fact;
 $("src").innerHTML=r.sources.map((u,k)=>`<a href="${u}" target="_blank" rel="noopener">source${r.sources.length>1?" "+(k+1):""}</a>`).join(" · ")+` · <a href="${r.archive}" target="_blank" rel="noopener">archive</a>`;
 $("toast").textContent=ok?(HYPE[streak]||""):(COPE[Math.min(miss,5)]||"");
 $("rev").classList.add("on");hud();$("next").textContent=i===N-1?"RESULTS →":"NEXT →";$("next").focus({preventScroll:true});
 $("rev").scrollIntoView({behavior:"smooth",block:"nearest"})}
function next(){if(!locked)return;i++;if(i>=N)return end();show();window.scrollTo({top:0,behavior:"smooth"})}
function end(){$("game").classList.remove("on");$("end").classList.add("on");$("prog").style.width="100%";
 $("fscore").textContent=`${score}/${N}`;$("frank").textContent=RANKS.find(x=>score>=x[0])[1];
 $("fsub").textContent=`best streak ${best}`;$("fgrid").textContent=log.join("")}
async function share(){const txt=`I scored ${score}/${N} on Scam or Startup 🚩\n${RANKS.find(x=>score>=x[0])[1]}\n${log.join("")}\n${location.href.startsWith("http")?location.href:""}`.trim();
 try{if(navigator.share&&/Mobi/i.test(navigator.userAgent)){await navigator.share({text:txt});return}await navigator.clipboard.writeText(txt);$("shareBtn").textContent="COPIED ✅"}catch(e){$("shareBtn").textContent="COPY FAILED"}
 setTimeout(()=>$("shareBtn").textContent="SHARE 🚩",1800)}
$("goBtn").onclick=start;$("againBtn").onclick=start;$("bScam").onclick=()=>guess("scam");$("bStart").onclick=()=>guess("startup");$("next").onclick=next;$("shareBtn").onclick=share;
document.addEventListener("keydown",e=>{const k=e.key.toLowerCase();
 if($("start").classList.contains("on")||$("end").classList.contains("on")){if(k==="enter"){e.preventDefault();start()}return}
 if(!locked){if(k==="s"||k==="arrowleft"||k==="1")guess("scam");else if(k==="d"||k==="arrowright"||k==="2")guess("startup")}
 else if(k==="enter"||k===" "||k==="n"||k==="arrowright"){e.preventDefault();next()}});
</script><script>
(function(){const z=document.getElementById("zoom"),zi=document.getElementById("zimg");
document.getElementById("img").addEventListener("click",e=>{zi.src=e.target.src;z.classList.add("on");z.scrollLeft=0;z.scrollTop=0});
document.getElementById("zx").addEventListener("click",e=>{e.stopPropagation();z.classList.remove("on")});
z.addEventListener("click",e=>{if(e.target===z)z.classList.remove("on")});})();
</script></body></html>
